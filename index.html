<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>릴리 볼 파이트</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            touch-action: none;
        }
        html, body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* 화면 아래(좌측 하단)로 이동한 릴리 전용 어드민 아이콘 */
        .admin-entry-box {
            position: fixed;
            bottom: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
        }
        .admin-icon {
            font-size: 24px;
            line-height: 1;
        }
        .admin-label {
            font-size: 11px;
            font-weight: bold;
            color: #555555;
            margin-top: 2px;
        }

        /* 큼직하고 네모난 전면 공지/투표 배너 */
        #global-announcement-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            background-color: #2c3e50;
            color: #ffffff;
            padding: 16px 15px;
            z-index: 99999;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            display: none;
            border-bottom: 5px solid #000;
        }
        #global-announcement-banner.show {
            display: block;
        }
        .banner-notice-text {
            font-size: 22px;
            font-weight: 900;
            text-align: center;
            line-height: 1.3;
        }
        .banner-vote-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .vote-options-row {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 6px;
        }
        .btn-vote-opt {
            flex: 1;
            padding: 14px 8px;
            font-size: 18px;
            font-weight: 900;
            border: 3.5px solid #000000;
            color: #ffffff;
            cursor: pointer;
            text-align: center;
            outline: none;
            border-radius: 6px;
        }
        .btn-vote-red { background-color: #e74c3c; }
        .btn-vote-blue { background-color: #3498db; }

        /* 메인 컨테이너 */
        .app-container {
            width: 98vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 화면 상단 토스트 알림 메시지 */
        #toast-alert {
            position: fixed;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.92);
            color: #ffffff;
            padding: 22px 40px;
            border-radius: 40px;
            font-size: 28px;
            font-weight: 900;
            z-index: 100000;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            pointer-events: none;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            white-space: nowrap;
            border: 4px solid #ffffff;
        }
        #toast-alert.show {
            opacity: 1;
        }

        /* 중앙 경기장 사각형 뷰포트 */
        .arena-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 6px solid #000000;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 볼 선택하기 슬롯 영역 */
        .slot-container {
            display: flex;
            gap: 14px;
            width: 100%;
            margin-top: 22px;
        }
        .btn-add-slot {
            flex: 1;
            padding: 28px 0;
            background: #555555;
            color: #ffffff;
            border: 4px solid #000000;
            font-size: 26px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            outline: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-add-slot.selected {
            background: #27ae60;
        }

        /* 시작하기 / 나가기 버튼 */
        .btn-main-action {
            margin-top: 24px;
            width: 95%;
            padding: 28px 0;
            font-size: 36px;
            font-weight: 900;
            border: 4px solid #000000;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 7px 0 #000000;
            outline: none;
        }
        .btn-start { background-color: #2ecc71; color: #ffffff; }
        .btn-exit { background-color: #e74c3c; color: #ffffff; }
        .btn-main-action:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #000000;
        }

        /* 인게임 HP 바 영역 */
        .ingame-status-panel {
            width: 100%;
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .status-row-group {
            display: flex;
            gap: 14px;
            width: 100%;
        }
        .player-status-card {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .player-name-label {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-name-p1 { color: #1e90ff; }
        .player-name-p2 { color: #e74c3c; text-align: right; }

        .hp-bar-outer {
            width: 100%;
            height: 42px;
            background: #e0e0e0;
            border: 4px solid #000000;
            position: relative;
            overflow: hidden;
        }
        .hp-bar-inner {
            height: 100%;
            background: #2ecc71;
            width: 100%;
            transition: width 0.15s;
        }
        .hp-text-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 22px;
            text-shadow: 1px 1px 2px #000;
        }
        .sub-gauge-bar {
            width: 100%;
            height: 10px;
            background: #cccccc;
            border: 1.5px solid #000000;
            margin-top: 4px;
        }
        .sub-gauge-fill {
            height: 100%;
            background: #4a90e2;
            width: 0%;
        }

        /* 볼 선택 모달 팝업창 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 15px;
        }
        .modal-overlay.hidden { display: none !important; }

        .picker-modal-box {
            width: 92vw;
            max-width: 520px;
            height: 75vh;
            max-height: 550px;
            background: #ffffff;
            border: 6px solid #000000;
            padding: 40px 25px 25px 25px;
            position: relative;
            box-shadow: 0 16px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .modal-close-btn {
            position: absolute;
            top: 16px; right: 16px;
            width: 52px; height: 52px;
            border: 3.5px solid #000000;
            background: #ffffff;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .picker-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 20px;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            touch-action: pan-y !important;
        }
        .ball-select-btn {
            background: #4a4a4a;
            color: #ffffff;
            border: 4px solid #000000;
            padding: 24px 12px;
            font-size: 26px;
            font-weight: 900;
            text-align: center;
            cursor: pointer;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            outline: none;
        }

        /* 초대형 드래그 이동 가능 관리자 패널 */
        .admin-draggable-panel {
            position: absolute;
            width: 95vw;
            max-width: 650px;
            height: 82vh;
            max-height: 780px;
            background: #ffffff;
            border: 7px solid #000000;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            z-index: 10001;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        /* 패널 드래그 헤더 (손으로 잡고 이동시키는 상단 바) */
        .admin-drag-header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 16px 20px;
            font-size: 26px;
            font-weight: 900;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid #000;
        }

        /* 자유 스크롤 내부 컨텐츠 영역 */
        .admin-scroll-body {
            padding: 25px;
            overflow-y: auto !important;
            touch-action: pan-y !important;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .admin-input {
            width: 100%;
            padding: 18px;
            font-size: 22px;
            border: 3.5px solid #000;
            text-align: center;
            outline: none;
        }
        .admin-btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .admin-btn {
            flex: 1;
            padding: 18px 0;
            font-size: 20px;
            font-weight: bold;
            border: 3.5px solid #000;
            cursor: pointer;
            outline: none;
        }
        .admin-btn-confirm { background: #2ecc71; color: #fff; }
        .admin-btn-cancel { background: #e74c3c; color: #fff; }

        .admin-section-box {
            background: #f8f9fa;
            border: 4px solid #000;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .admin-section-title {
            font-size: 24px;
            font-weight: 900;
        }
        .row-inline-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .btn-send {
            background-color: #3498db;
            color: #ffffff;
            border: 3.5px solid #000;
            font-size: 22px;
            font-weight: 900;
            padding: 0 26px;
            cursor: pointer;
            white-space: nowrap;
            outline: none;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 화면 아래(좌측 하단)로 이동한 릴리 전용 아이콘 -->
    <div class="admin-entry-box" onclick="openAdminPrompt()">
        <div class="admin-icon">🚫</div>
        <div class="admin-label">릴리 전용</div>
    </div>

    <!-- 상단 대형 실시간 공지/투표 배너 -->
    <div id="global-announcement-banner"></div>

    <!-- 화면 상단 토스트 알림 메시지 -->
    <div id="toast-alert">양쪽 공을 모두 선택해 주세요!</div>

    <!-- 메인 컨테이너 -->
    <div class="app-container">

        <!-- 경기장 뷰포트 사각형 -->
        <div class="arena-frame">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
        </div>

        <!-- 로비 대기 화면 -->
        <div id="lobby-controls" style="width:100%; display:flex; flex-direction:column; align-items:center;">
            <div class="slot-container">
                <button class="btn-add-slot" id="slot-left-btn" onclick="handleSlotClick('left')">볼 선택하기</button>
                <button class="btn-add-slot" id="slot-right-btn" onclick="handleSlotClick('right')">볼 선택하기</button>
            </div>
            <button class="btn-main-action btn-start" onclick="startMatch()">시작하기 ▶</button>
        </div>

        <!-- 인게임 대결 화면 -->
        <div id="ingame-controls" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
            <div class="ingame-status-panel">
                <div class="status-row-group">
                    <div class="player-status-card">
                        <div class="player-name-label player-name-p1" id="p1-name-txt">동룡쓰</div>
                        <div class="hp-bar-outer">
                            <div class="hp-bar-inner" id="p1-hp-fill"></div>
                            <div class="hp-text-overlay" id="p1-hp-txt">250 / 250</div>
                        </div>
                        <div class="sub-gauge-bar"><div class="sub-gauge-fill" style="width:70%;"></div></div>
                    </div>
                    <div class="player-status-card">
                        <div class="player-name-label player-name-p2" id="p2-name-txt">미스터비스트</div>
                        <div class="hp-bar-outer">
                            <div class="hp-bar-inner" id="p2-hp-fill"></div>
                            <div class="hp-text-overlay" id="p2-hp-txt">250 / 250</div>
                        </div>
                        <div class="sub-gauge-bar"><div class="sub-gauge-fill" style="width:40%;"></div></div>
                    </div>
                </div>
            </div>
            <button class="btn-main-action btn-exit" onclick="exitMatch()">나가기 🚪</button>
        </div>

    </div>

    <!-- 볼 선택 모달 팝업창 -->
    <div class="modal-overlay hidden" id="ball-picker-modal">
        <div class="picker-modal-box">
            <button class="modal-close-btn" onclick="closeBallPicker()">✕</button>
            <div class="picker-grid" id="ball-picker-grid"></div>
        </div>
    </div>

    <!-- 어드민 비밀번호 입력 모달 -->
    <div class="modal-overlay hidden" id="admin-password-modal">
        <div style="background:#fff; border:6px solid #000; padding:30px; width:90vw; max-width:420px; text-align:center;">
            <div style="font-size:26px; font-weight:900; margin-bottom:20px;">🔒 릴리 전용 어드민</div>
            <input type="password" id="admin-pw-input" class="admin-input" placeholder="비밀번호 입력" style="margin-bottom:20px;">
            <div class="admin-btn-group">
                <button class="admin-btn admin-btn-confirm" onclick="verifyAdminPassword()">확인</button>
                <button class="admin-btn admin-btn-cancel" onclick="closeAdminPassword()">취소</button>
            </div>
        </div>
    </div>

    <!-- 터치로 자유롭게 드래그해서 이동시키는 초대형 관리자 패널 -->
    <div class="admin-draggable-panel hidden" id="admin-panel-modal">
        <div class="admin-drag-header" id="admin-drag-header-bar">
            <span>⚙️ 관리자 패널 (손으로 이동 가능)</span>
            <span style="cursor:pointer;" onclick="closeAdminPanel()">✕</span>
        </div>
        <div class="admin-scroll-body">
            <!-- 깔끔한 한글 안내 텍스트만 유지 -->
            <div style="font-size:24px; font-weight:900; text-align:center; color:#2c3e50;">
                어드민 패널을 사용하세요
            </div>

            <!-- 공지 작성 영역 -->
            <div class="admin-section-box">
                <div class="admin-section-title">📢 공지 보내기</div>
                <div class="row-inline-group">
                    <input type="text" id="admin-notice-input" class="admin-input" style="margin-bottom:0;" placeholder="공지 내용을 입력하세요">
                    <button class="btn-send" onclick="sendNotice()">보내기</button>
                </div>
            </div>

            <!-- 주제 선택 창 삭제! 1. 입력 / 2. 입력 바로 넣기 -->
            <div class="admin-section-box">
                <div class="admin-section-title">📊 투표 만들기</div>
                <div class="row-inline-group">
                    <input type="text" id="admin-vote-opt1" class="admin-input" style="margin-bottom:0;" placeholder="1. 입력">
                    <input type="text" id="admin-vote-opt2" class="admin-input" style="margin-bottom:0;" placeholder="2. 입력">
                </div>
                <button class="btn-send" style="width:100%; margin-top:5px; background-color:#9b59b6; padding:16px 0;" onclick="sendVote()">보내기</button>
            </div>

            <button class="admin-btn admin-btn-confirm" style="width:100%; padding:18px;" onclick="closeAdminPanel()">닫기</button>
        </div>
    </div>

    <script>
        // 카카오톡 브라우저 강제 이동 (고정)
        (function forceOpenInChrome() {
            const userAgent = navigator.userAgent.toLowerCase();
            const targetUrl = location.href;

            if (userAgent.indexOf('kakaotalk') !== -1) {
                if (userAgent.indexOf('android') !== -1) {
                    location.href = 'intent://' + targetUrl.replace(/https?:\/\//i, '') + '#Intent;scheme=http;package=com.android.chrome;end';
                } else if (userAgent.indexOf('iphone') !== -1 || userAgent.indexOf('ipad') !== -1) {
                    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(targetUrl);
                }
            }
        })();

        // 모바일 스크롤 바운싱 차단 (관리자 패널 내부/팝업 리스트는 터치 스크롤 허용)
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.admin-scroll-body') || e.target.closest('.picker-grid')) {
                return;
            }
            e.preventDefault();
        }, { passive: false });

        // 화면 상단 토스트 메시지 띄우는 함수
        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById('toast-alert');
            toast.innerText = message;
            toast.classList.add('show');

            if (toastTimer) clearTimeout(toastTimer);

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 비밀번호 인증 로직
        function openAdminPrompt() {
            document.getElementById('admin-pw-input').value = '';
            document.getElementById('admin-password-modal').classList.remove('hidden');
        }

        function closeAdminPassword() {
            document.getElementById('admin-password-modal').classList.add('hidden');
        }

        function verifyAdminPassword() {
            const pw = document.getElementById('admin-pw-input').value;
            if (pw === '걱스키비디야르7') {
                closeAdminPassword();
                const panel = document.getElementById('admin-panel-modal');
                panel.style.left = '50%';
                panel.style.top = '50%';
                panel.style.transform = 'translate(-50%, -50%)';
                panel.classList.remove('hidden');
            } else {
                showToast('비밀번호가 틀렸습니다!');
            }
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel-modal').classList.add('hidden');
        }

        // 공지 전송 기능
        function sendNotice() {
            const text = document.getElementById('admin-notice-input').value.trim();
            if (!text) {
                showToast('글씨를 적어주세요!');
                return;
            }
            const banner = document.getElementById('global-announcement-banner');
            banner.innerHTML = `<div class="banner-notice-text">📢 ${text}</div>`;
            banner.classList.add('show');
            showToast('공지가 전송되었습니다!');
            closeAdminPanel();
        }

        // 투표 실시간 득표 상태 변수
        let voteCount1 = 0;
        let voteCount2 = 0;
        let voteOpt1Text = '';
        let voteOpt2Text = '';

        // 투표 전송 기능 (주제 없이 1, 2 입력으로 전송)
        function sendVote() {
            const opt1 = document.getElementById('admin-vote-opt1').value.trim();
            const opt2 = document.getElementById('admin-vote-opt2').value.trim();

            if (!opt1 || !opt2) {
                showToast('글씨를 적어주세요!');
                return;
            }

            voteCount1 = 0;
            voteCount2 = 0;
            voteOpt1Text = opt1;
            voteOpt2Text = opt2;

            renderVoteBanner();
            showToast('투표가 시작되었습니다!');
            closeAdminPanel();
        }

        // 실시간 투표 선택 및 [명] 고름 갱신 처리
        function renderVoteBanner() {
            const banner = document.getElementById('global-announcement-banner');
            banner.innerHTML = `
                <div class="banner-vote-container">
                    <div style="font-size:22px; font-weight:900;">📊 [투표 진행 중] 하나를 선택해 주세요!</div>
                    <div class="vote-options-row">
                        <button class="btn-vote-opt btn-vote-red" onclick="castVote(1)">
                            1. ${voteOpt1Text} [${voteCount1}명 고름]
                        </button>
                        <button class="btn-vote-opt btn-vote-blue" onclick="castVote(2)">
                            2. ${voteOpt2Text} [${voteCount2}명 고름]
                        </button>
                    </div>
                </div>
            `;
            banner.classList.add('show');
        }

        function castVote(optionIndex) {
            if (optionIndex === 1) voteCount1++;
            if (optionIndex === 2) voteCount2++;
            renderVoteBanner();
            showToast('투표가 완료되었습니다!');
        }

        // 관리자 패널 터치 & 마우스 드래그 이동 기능 로직 구현
        (function enablePanelDrag() {
            const panel = document.getElementById('admin-panel-modal');
            const header = document.getElementById('admin-drag-header-bar');

            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            function onStart(e) {
                isDragging = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const rect = panel.getBoundingClientRect();
                startX = clientX;
                startY = clientY;
                initialLeft = rect.left;
                initialTop = rect.top;

                panel.style.transform = 'none';
                panel.style.left = initialLeft + 'px';
                panel.style.top = initialTop + 'px';
            }

            function onMove(e) {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const dx = clientX - startX;
                const dy = clientY - startY;

                panel.style.left = (initialLeft + dx) + 'px';
                panel.style.top = (initialTop + dy) + 'px';
            }

            function onEnd() {
                isDragging = false;
            }

            header.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);

            header.addEventListener('touchstart', onStart, { passive: true });
            document.addEventListener('touchmove', onMove, { passive: true });
            document.addEventListener('touchend', onEnd);
        })();

        const ballList = [
            { name: '동룡쓰', hp: 250, imageSrc: 'dongryong.png' },
            { name: '미스터비스트', hp: 250, imageSrc: 'character.jpg' },
            { name: '상품컴퍼니', hp: 250, imageSrc: 'sangsampany.png' },
            { name: '왕클세종', hp: 250, imageSrc: 'wangkl.png' },
            { name: '본이', hp: 250, color: '#e67e22' }
        ];

        const loadedImages = {};
        ballList.forEach(ball => {
            if (ball.imageSrc) {
                const img = new Image();
                img.src = ball.imageSrc;
                loadedImages[ball.name] = img;
            }
        });

        let selectedLeftBall = null;
        let selectedRightBall = null;
        let currentTargetSide = null;

        let isGaming = false;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let p1 = { x: 150, y: 250, radius: 45, vx: 0, vy: 0, hp: 250, maxHp: 250, name: '', ballData: null };
        let p2 = { x: 350, y: 250, radius: 45, vx: 0, vy: 0, hp: 250, maxHp: 250, name: '', ballData: null };

        function handleSlotClick(side) {
            if (side === 'left') {
                if (selectedLeftBall) {
                    selectedLeftBall = null;
                    p1.name = '';
                    p1.ballData = null;
                    const slotBtn = document.getElementById('slot-left-btn');
                    slotBtn.innerText = '볼 선택하기';
                    slotBtn.classList.remove('selected');
                    drawPreview();
                } else {
                    openBallPicker('left');
                }
            } else if (side === 'right') {
                if (selectedRightBall) {
                    selectedRightBall = null;
                    p2.name = '';
                    p2.ballData = null;
                    const slotBtn = document.getElementById('slot-right-btn');
                    slotBtn.innerText = '볼 선택하기';
                    slotBtn.classList.remove('selected');
                    drawPreview();
                } else {
                    openBallPicker('right');
                }
            }
        }

        function openBallPicker(side) {
            currentTargetSide = side;
            const grid = document.getElementById('ball-picker-grid');
            grid.innerHTML = '';

            ballList.forEach(ball => {
                const btn = document.createElement('div');
                btn.className = 'ball-select-btn';
                btn.innerText = ball.name;
                btn.onclick = () => chooseBall(ball);
                grid.appendChild(btn);
            });

            document.getElementById('ball-picker-modal').classList.remove('hidden');
        }

        function closeBallPicker() {
            document.getElementById('ball-picker-modal').classList.add('hidden');
        }

        function chooseBall(ball) {
            if (currentTargetSide === 'left') {
                selectedLeftBall = ball;
                p1.name = ball.name;
                p1.ballData = ball;
                const slotBtn = document.getElementById('slot-left-btn');
                slotBtn.innerText = ball.name;
                slotBtn.classList.add('selected');
            } else {
                selectedRightBall = ball;
                p2.name = ball.name;
                p2.ballData = ball;
                const slotBtn = document.getElementById('slot-right-btn');
                slotBtn.innerText = ball.name;
                slotBtn.classList.add('selected');
            }
            closeBallPicker();
            drawPreview();
        }

        function drawPreview() {
            if (isGaming) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (selectedLeftBall) {
                drawBall(150, 250, p1.radius, selectedLeftBall, "rgba(30, 144, 255, 0.15)");
            }

            if (selectedRightBall) {
                drawBall(350, 250, p2.radius, selectedRightBall, "rgba(231, 76, 60, 0.15)");
            }
        }

        function drawBall(x, y, radius, ballObj, auraColor) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, radius + 22, 0, Math.PI * 2);
            ctx.fillStyle = auraColor;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.save();
            ctx.clip();

            if (ballObj.imageSrc && loadedImages[ballObj.name] && loadedImages[ballObj.name].complete) {
                ctx.drawImage(loadedImages[ballObj.name], x - radius, y - radius, radius * 2, radius * 2);
            } else {
                ctx.fillStyle = ballObj.color || '#999999';
                ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(ballObj.name, x, y);
            }
            ctx.restore();

            ctx.lineWidth = 4.5;
            ctx.strokeStyle = "#000000";
            ctx.stroke();
            ctx.restore();
        }

        function getRandomVelocity(min, max) {
            let val = (Math.random() * (max - min) + min) * (Math.random() < 0.5 ? 1 : -1);
            if (Math.abs(val) < min) val = val < 0 ? -min : min;
            return val;
        }

        function startMatch() {
            if (!selectedLeftBall || !selectedRightBall) {
                showToast('양쪽 공을 모두 선택해 주세요!');
                return;
            }

            p1.maxHp = selectedLeftBall.hp;
            p1.hp = selectedLeftBall.hp;
            p1.x = 150; p1.y = 250;
            p1.vx = getRandomVelocity(2.5, 5);
            p1.vy = getRandomVelocity(2.5, 5);
            p1.ballData = selectedLeftBall;

            p2.maxHp = selectedRightBall.hp;
            p2.hp = selectedRightBall.hp;
            p2.x = 350; p2.y = 250;
            p2.vx = getRandomVelocity(2.5, 5);
            p2.vy = getRandomVelocity(2.5, 5);
            p2.ballData = selectedRightBall;

            document.getElementById('p1-name-txt').innerText = p1.name;
            document.getElementById('p2-name-txt').innerText = p2.name;

            document.getElementById('lobby-controls').classList.add('hidden');
            document.getElementById('ingame-controls').classList.remove('hidden');

            isGaming = true;
            updateHpBars();
        }

        function exitMatch() {
            isGaming = false;
            
            selectedLeftBall = null;
            selectedRightBall = null;
            p1.name = '';
            p2.name = '';
            p1.ballData = null;
            p2.ballData = null;

            const leftBtn = document.getElementById('slot-left-btn');
            leftBtn.innerText = '볼 선택하기';
            leftBtn.classList.remove('selected');

            const rightBtn = document.getElementById('slot-right-btn');
            rightBtn.innerText = '볼 선택하기';
            rightBtn.classList.remove('selected');

            document.getElementById('ingame-controls').classList.add('hidden');
            document.getElementById('lobby-controls').classList.remove('hidden');
            drawPreview();
        }

        function updateHpBars() {
            const p1Pct = Math.max(0, (p1.hp / p1.maxHp) * 100);
            const p2Pct = Math.max(0, (p2.hp / p2.maxHp) * 100);

            document.getElementById('p1-hp-fill').style.width = p1Pct + '%';
            document.getElementById('p1-hp-txt').innerText = `${Math.ceil(p1.hp)} / ${p1.maxHp}`;

            document.getElementById('p2-hp-fill').style.width = p2Pct + '%';
            document.getElementById('p2-hp-txt').innerText = `${Math.ceil(p2.hp)} / ${p2.maxHp}`;
        }

        function runGameLoop() {
            if (isGaming) {
                p1.x += p1.vx; p1.y += p1.vy;
                p2.x += p2.vx; p2.y += p2.vy;

                if (p1.x - p1.radius < 0 || p1.x + p1.radius > canvas.width) p1.vx *= -1;
                if (p1.y - p1.radius < 0 || p1.y + p1.radius > canvas.height) p1.vy *= -1;
                if (p2.x - p2.radius < 0 || p2.x + p2.radius > canvas.width) p2.vx *= -1;
                if (p2.y - p2.radius < 0 || p2.y + p2.radius > canvas.height) p2.vy *= -1;

                let dx = p2.x - p1.x;
                let dy = p2.y - p1.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < p1.radius + p2.radius) {
                    let tempVx = p1.vx; let tempVy = p1.vy;
                    p1.vx = p2.vx; p1.vy = p2.vy;
                    p2.vx = tempVx; p2.vy = tempVy;

                    p1.hp = Math.max(0, p1.hp - 10);
                    p2.hp = Math.max(0, p2.hp - 10);
                    updateHpBars();

                    if (p1.hp <= 0 || p2.hp <= 0) {
                        isGaming = false;
                        setTimeout(() => {
                            if (p1.hp <= 0 && p2.hp <= 0) {
                                showToast('🤝 무승부!');
                            } else {
                                showToast(p1.hp > 0 ? `🏆 ${p1.name} 승리!` : `🏆 ${p2.name} 승리!`);
                            }
                            exitMatch();
                        }, 100);
                    }
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawBall(p1.x, p1.y, p1.radius, p1.ballData, "rgba(30, 144, 255, 0.15)");
                drawBall(p2.x, p2.y, p2.radius, p2.ballData, "rgba(231, 76, 60, 0.15)");
            }

            requestAnimationFrame(runGameLoop);
        }

        requestAnimationFrame(runGameLoop);
    </script>
</body>
</html>
