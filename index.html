<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>릴리 볼 파이트</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        }
        html, body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: fixed;
            overscroll-behavior: none;
        }

        .app-container {
            width: 100vw;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            padding: 10px 6px;
            transform: scale(1.35);
            transform-origin: center center;
            transition: transform 0.2s ease;
        }

        .top-menu-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
            padding: 0;
            margin-bottom: 6px;
            z-index: 1000;
        }

        .settings-gear-btn {
            width: 40px;
            height: 40px;
            background: #f1f2f6;
            border: 3px solid #000;
            border-radius: 6px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 0 #000;
            pointer-events: auto;
        }
        .settings-gear-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        #toast-alert {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.94);
            color: #ffffff;
            padding: 14px 26px;
            border-radius: 35px;
            font-size: 24px;
            font-weight: 900;
            z-index: 100000;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            white-space: nowrap;
            border: 3px solid #ffffff;
        }
        #toast-alert.show {
            opacity: 1;
        }

        .arena-container-wrapper {
            position: relative;
            width: 480px;
            max-width: 92vw;
            pointer-events: auto;
        }

        .arena-frame {
            width: 480px;
            height: 480px;
            max-width: 100%;
            max-height: 45vh;
            border: 5px solid #000000;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: auto;
        }

        .controls-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 6px;
            pointer-events: auto;
            z-index: 100;
        }

        .slot-container {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 6px;
            pointer-events: auto;
        }
        .slot-team-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
        }
        .slot-team-title {
            font-size: 15px;
            font-weight: 900;
            text-align: center;
        }
        .btn-add-slot {
            width: 100%;
            padding: 12px 4px;
            background: #555555;
            color: #ffffff;
            border: 3px solid #000000;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            outline: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-radius: 6px;
            box-shadow: 0 3px 0 #000;
            pointer-events: auto;
            position: relative;
            z-index: 101;
        }
        .btn-add-slot.selected {
            background: #27ae60;
        }

        .btn-main-action {
            margin-top: 6px;
            width: 100%;
            padding: 14px 0;
            font-size: 22px;
            font-weight: 900;
            border: 3px solid #000000;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 3px 0 #000000;
            outline: none;
            pointer-events: auto;
            position: relative;
            z-index: 101;
        }
        .btn-start { background-color: #2ecc71; color: #ffffff; }
        .btn-exit { background-color: #e74c3c; color: #ffffff; }
        .btn-main-action:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #000000;
        }

        .ingame-status-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
        }
        .status-row-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .player-status-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .player-name-label {
            font-size: 15px;
            font-weight: 900;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-name-p1 { color: #1e90ff; }
        .player-name-p2 { color: #e74c3c; text-align: right; }

        .hp-bar-outer {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border: 3px solid #000000;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }
        .hp-bar-inner {
            height: 100%;
            background: #2ecc71;
            width: 100%;
            transition: width 0.4s ease-in-out;
        }
        .hp-text-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 900;
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
        }
        .sub-gauge-bar {
            width: 100%;
            height: 20px;
            background: #cccccc;
            border: 3px solid #000000;
            margin-top: 3px;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }
        .sub-gauge-fill {
            height: 100%;
            background: #8e44ad;
            width: 0%;
        }
        .sub-gauge-text {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 900;
            color: #000;
        }

        @keyframes floatPlusAnim {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-40px) scale(1.4); opacity: 0; }
        }
        .healing-popup-text {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #2ecc71;
            font-size: 22px;
            font-weight: 900;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
            animation: floatPlusAnim 0.8s ease-out forwards;
            z-index: 500;
        }

        @keyframes floatMinusAnim {
            0% { transform: translateY(0) scale(0.9); opacity: 1; }
            100% { transform: translateY(-40px) scale(1.4); opacity: 0; }
        }
        .minus-popup-text {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #e74c3c;
            font-size: 22px;
            font-weight: 900;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
            animation: floatMinusAnim 0.8s ease-out forwards;
            z-index: 500;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            pointer-events: none;
            padding: 15px;
        }
        .modal-overlay.hidden { display: none !important; }
        .modal-overlay > * { pointer-events: auto; }

        .picker-modal-box {
            width: 94vw;
            max-width: 680px;
            height: 78vh;
            max-height: 750px;
            background: #ffffff;
            border: 6px solid #000000;
            padding: 45px 26px 26px 26px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            z-index: 100000;
        }
        
        .modal-close-btn {
            position: absolute;
            top: 14px; right: 14px;
            width: 48px; height: 48px;
            border: 3px solid #000000;
            background: #ffffff;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            z-index: 100;
            pointer-events: auto;
        }

        .picker-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 18px;
            flex: 1;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
            padding-right: 6px;
            pointer-events: auto;
        }
        .ball-select-btn {
            background: #4a4a4a;
            color: #ffffff;
            border: 3px solid #000000;
            padding: 20px 18px;
            font-size: 22px;
            font-weight: 900;
            text-align: center;
            cursor: pointer;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            outline: none;
            flex-shrink: 0;
            border-radius: 6px;
            pointer-events: auto;
        }

        .admin-btn {
            padding: 16px 0;
            font-size: 22px;
            font-weight: 900;
            border: 3px solid #000;
            cursor: pointer;
            outline: none;
            border-radius: 6px;
            pointer-events: auto;
        }
        .admin-btn-confirm { background: #2ecc71; color: #fff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <script>
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); });
    </script>

    <!-- 화면 상단 토스트 알림 메시지 -->
    <div id="toast-alert">양쪽 공을 모두 선택해 주세요!</div>

    <!-- 메인 컨테이너 -->
    <div class="app-container" id="main-app-container">

        <!-- 상단 설정 메뉴 바 -->
        <div class="top-menu-bar" id="lobby-top-menu-bar">
            <div class="settings-gear-btn" onclick="playClickSound(); openSettingsModal();">⚙️</div>
        </div>

        <!-- 경기장 및 래퍼 -->
        <div class="arena-container-wrapper">
            <div class="arena-frame" id="arena-frame-box" style="position: relative; overflow: hidden;">
                <canvas id="gameCanvas" width="480" height="480"></canvas>
            </div>
        </div>

        <!-- 로비 및 컨트롤 영역 -->
        <div class="controls-wrapper">
            <div id="lobby-controls" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <div class="slot-container" id="dynamic-slot-container"></div>
                <button class="btn-main-action btn-start" id="btn-start-match" onclick="playClickSound(); startMatch();">시작하기 ▶</button>
            </div>

            <div id="ingame-controls" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <div class="ingame-status-panel" id="ingame-status-panel-container"></div>
                <button class="btn-main-action btn-exit" id="btn-exit-match" onclick="playClickSound(); exitMatch();">나가기 🚪</button>
            </div>
        </div>

    </div>

    <!-- 게임 설정 모달 팝업 창 -->
    <div class="modal-overlay hidden" id="settings-modal" style="z-index: 200000; background: rgba(0, 0, 0, 0.5);">
        <div style="background:#fff; border:6px solid #000; padding:45px 36px; width:94%; max-width:560px; text-align:center; box-shadow:0 25px 60px rgba(0,0,0,0.5); position:relative;">
            <button class="modal-close-btn" style="width:52px; height:52px; font-size:26px;" onclick="playClickSound(); closeSettingsModal();">✕</button>
            <div style="font-size:34px; font-weight:900; margin-bottom:26px; color:#000;">⚙️ 게임 설정</div>
            
            <div style="margin-bottom:26px; text-align:left;">
                <div style="font-size:20px; font-weight:900; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                    <span>🔊 효과음 소리 (0 ~ 1000)</span>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <input type="text" id="sfx-input-box" value="100" style="width:90px; padding:8px; font-size:18px; font-weight:900; border:3px solid #000; text-align:center; outline:none; border-radius:6px;">
                        <button onclick="playClickSound(); applySfxInput();" style="padding:8px 14px; font-size:18px; font-weight:900; background:#3498db; color:#fff; border:3px solid #000; cursor:pointer; border-radius:6px;">확인</button>
                    </div>
                </div>
                <input type="range" id="sfx-volume-range" min="0" max="1000" value="100" style="width:100%; cursor:pointer; height:10px;" oninput="syncSfxRange(this.value)">
            </div>

            <div style="margin-bottom:34px; text-align:left;">
                <div style="font-size:20px; font-weight:900; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                    <span>🔍 화면 확대 (0 ~ 150)</span>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <input type="text" id="zoom-input-box" value="35" style="width:80px; padding:8px; font-size:18px; font-weight:900; border:3px solid #000; text-align:center; outline:none; border-radius:6px;">
                        <button onclick="playClickSound(); applyZoomInput();" style="padding:8px 14px; font-size:18px; font-weight:900; background:#3498db; color:#fff; border:3px solid #000; cursor:pointer; border-radius:6px;">확인</button>
                    </div>
                </div>
                <input type="range" id="zoom-scale-range" min="0" max="150" value="35" style="width:100%; cursor:pointer; height:10px;" oninput="syncZoomRange(this.value)">
            </div>

            <button class="admin-btn admin-btn-confirm" style="width:100%; padding:18px; font-size:24px; font-weight:900; background-color:#27ae60;" onclick="playClickSound(); saveGameSettings();">💾 저장하기</button>
        </div>
    </div>

    <!-- 볼 선택 모달 팝업창 -->
    <div class="modal-overlay hidden" id="ball-picker-modal">
        <div class="picker-modal-box">
            <button class="modal-close-btn" style="width:48px; height:48px; font-size:24px;" onclick="playClickSound(); closeBallPicker();">✕</button>
            <div style="font-size:26px; font-weight:900; text-align:center; margin-bottom:8px; flex-shrink:0;">⚽ 볼 선택하기</div>
            <div class="picker-grid" id="ball-picker-grid"></div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let soundVolume = 1.0;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        window.addEventListener('pointerdown', () => { getAudioContext(); }, { once: true });

        function playClickSound() {
            try {
                let ctx = getAudioContext();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.2 * soundVolume, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.05);
            } catch(e) {}
        }

        function playHitSound() {
            try {
                let ctx = getAudioContext();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.09);
                gain.gain.setValueAtTime(0.3 * soundVolume, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.09);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.09);
            } catch(e) {}
        }

        function playWallSound() {
            try {
                let ctx = getAudioContext();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.07);
                gain.gain.setValueAtTime(0.25 * soundVolume, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.07);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.07);
            } catch(e) {}
        }

        function playNormalBeepSound() {
            try {
                let ctx = getAudioContext();
                let now = ctx.currentTime;
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.2 * soundVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now); osc.stop(now + 0.15);
            } catch(e) {}
        }

        function playCountdownSound() {
            try {
                let ctx = getAudioContext();
                let now = ctx.currentTime;
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2200, now);
                osc.frequency.exponentialRampToValueAtTime(2700, now + 0.2);
                osc.frequency.exponentialRampToValueAtTime(2000, now + 0.4);
                gain.gain.setValueAtTime(0.3 * soundVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now); osc.stop(now + 0.5);
            } catch(e) {}
        }

        function playJiroExplosionSound() {
            try {
                let ctx = getAudioContext();
                let now = ctx.currentTime;
                let osc1 = ctx.createOscillator();
                let osc2 = ctx.createOscillator();
                let gain1 = ctx.createGain();
                let gain2 = ctx.createGain();
                
                osc1.type = 'sawtooth';
                osc2.type = 'square';
                
                osc1.frequency.setValueAtTime(180, now);
                osc1.frequency.exponentialRampToValueAtTime(30, now + 0.6);

                osc2.frequency.setValueAtTime(90, now);
                osc2.frequency.exponentialRampToValueAtTime(20, now + 0.6);

                gain1.gain.setValueAtTime(0.8 * soundVolume, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.65);

                gain2.gain.setValueAtTime(0.6 * soundVolume, now);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.65);

                osc1.connect(gain1); gain1.connect(ctx.destination);
                osc2.connect(gain2); gain2.connect(ctx.destination);

                osc1.start(now); osc2.start(now);
                osc1.stop(now + 0.65); osc2.stop(now + 0.65);
            } catch(e) {}
        }

        function playBoniBombSound() {
            try {
                let ctx = getAudioContext();
                let now = ctx.currentTime;
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
                gain.gain.setValueAtTime(0.5 * soundVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now); osc.stop(now + 0.38);
            } catch(e) {}
        }

        function playRouletteSpinSound() {
            try {
                let ctx = getAudioContext();
                let now = ctx.currentTime;
                for (let i = 0; i < 10; i++) {
                    let time = now + i * 0.09;
                    let osc = ctx.createOscillator();
                    let gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(600 + i * 50, time);
                    gain.gain.setValueAtTime(0.2 * soundVolume, time);
                    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.06);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(time); osc.stop(time + 0.06);
                }
            } catch(e) {}
        }

        function playRouletteWinSound() {
            try {
                let ctx = getAudioContext();
                let now = ctx.currentTime;
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    let time = now + idx * 0.08;
                    let osc = ctx.createOscillator();
                    let gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, time);
                    gain.gain.setValueAtTime(0.4 * soundVolume, time);
                    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.18);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(time); osc.stop(time + 0.18);
                });
            } catch(e) {}
        }

        function playArrowSound() {
            try {
                let ctx = getAudioContext();
                let now = ctx.currentTime;
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(1000, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
                gain.gain.setValueAtTime(0.3 * soundVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now); osc.stop(now + 0.14);
            } catch(e) {}
        }

        function playCoinSound() {
            try {
                let ctx = getAudioContext();
                let now = ctx.currentTime;
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(1400, now + 0.1);

        function setFixedSpeedVelocity(obj) {
            const angle = Math.random() * Math.PI * 2;
            let vx = Math.cos(angle) * FIXED_SPEED, vy = Math.sin(angle) * FIXED_SPEED;
            if (Math.abs(vx) < 1.2) vx = vx > 0 ? 1.4 : -1.4;
            if (Math.abs(vy) < 1.2) vy = vy > 0 ? 1.4 : -1.4;
            obj.vx = vx; obj.vy = vy;
        }

        function getSkillMaxTime(playerName) {
            if (playerName === '미스터비스트') return 7;
            if (playerName === 'JIRO') return 7;
            if (playerName === '왕클세종') return 8;
            if (playerName === 'JINO') return 8;
            if (playerName === '발작아저씨') return 5;
            if (playerName === '본이') return 6;
            if (playerName === '동룡쓰') return 5;
            return null;
        }

        function calculateMultiPositions(team, index, total) {
            let x, y;
            if (team === 1) {
                x = 120;
                y = total === 1 ? 240 : (total === 2 ? 150 + index * 180 : (total === 3 ? 100 + index * 140 : 75 + index * 110));
            } else {
                x = 360;
                y = total === 1 ? 240 : (total === 2 ? 150 + index * 180 : (total === 3 ? 100 + index * 140 : 75 + index * 110));
            }
            return { x, y };
        }

        function startMatch() {
            for (let i = 0; i < currentMatchMode; i++) {
                if (!selectedTeam1Balls[i] || !selectedTeam2Balls[i]) {
                    showToast('모든 팀의 볼을 선택해 주세요!');
                    return;
                }
            }

            if (gameInterval) clearInterval(gameInterval);
            if (activeCountdownInterval) clearInterval(activeCountdownInterval);

            moneyItems = []; matchEnded = false; winnerText = '';

            team1Players = selectedTeam1Balls.map((ball, idx) => {
                let pos = calculateMultiPositions(1, idx, currentMatchMode);
                let maxT = getSkillMaxTime(ball.name);
                return {
                    id: `t1_${idx}`, team: 1, name: ball.name, ballData: ball,
                    x: pos.x, y: pos.y, radius: BALL_RADIUS, vx: 0, vy: 0,
                    hp: ball.hp, maxHp: ball.hp, displayHp: ball.hp,
                    skillTimer: maxT !== null ? maxT : 0, skillCount: 0,
                    jiroCombo: 0, lastJiroHitTime: 0, lastX: pos.x, lastY: pos.y,
                    skeletons: [], minions: [], bombs: [], arrowTimer: 0, mines: [], explosionVisuals: [], comboPopups: [],
                    mrBeastToggleState: 0, dongryongTeleported: false, slowTimer: 0,
                    rouletteAnim: null, poisonTimer: 0, poisonTickTimer: 0
                };
            });

            team2Players = selectedTeam2Balls.map((ball, idx) => {
                let pos = calculateMultiPositions(2, idx, currentMatchMode);
                let maxT = getSkillMaxTime(ball.name);
                return {
                    id: `t2_${idx}`, team: 2, name: ball.name, ballData: ball,
                    x: pos.x, y: pos.y, radius: BALL_RADIUS, vx: 0, vy: 0,
                    hp: ball.hp, maxHp: ball.hp, displayHp: ball.hp,
                    skillTimer: maxT !== null ? maxT : 0, skillCount: 0,
                    jiroCombo: 0, lastJiroHitTime: 0, lastX: pos.x, lastY: pos.y,
                    skeletons: [], minions: [], bombs: [], arrowTimer: 0, mines: [], explosionVisuals: [], comboPopups: [],
                    mrBeastToggleState: 0, dongryongTeleported: false, slowTimer: 0,
                    rouletteAnim: null, poisonTimer: 0, poisonTickTimer: 0
                };
            });

            team1Players.forEach(p => setFixedSpeedVelocity(p));
            team2Players.forEach(p => setFixedSpeedVelocity(p));
            allPlayers = [...team1Players, ...team2Players];

            buildIngameStatusPanel();
            document.getElementById('lobby-top-menu-bar').classList.add('hidden');
            document.getElementById('lobby-controls').classList.add('hidden');
            document.getElementById('ingame-controls').classList.remove('hidden');

            isCountingDown = true; isGaming = false;
            let count = 3; 
            countdownText = `${count}`;
            playNormalBeepSound();
            showToast(`게임 시작까지 ${count}초...`);

            activeCountdownInterval = setInterval(() => {
                if (!isCountingDown) { clearInterval(activeCountdownInterval); return; }
                count--;
                if (count > 0) {
                    countdownText = `${count}`;
                    playNormalBeepSound();
                    showToast(`게임 시작까지 ${count}초...`);
                } else if (count === 0) {
                    countdownText = `시작!`;
                    playCountdownSound();
                    showToast(`경기 시작! 🔥`);
                } else {
                    clearInterval(activeCountdownInterval);
                    isCountingDown = false; isGaming = true; countdownText = '';
                    runMainGameLoop();

            }, 1000);

        function runMainGameLoop() {
            gameInterval = setInterval(() => {
                if (!isGaming || matchEnded) return;
                const nowTimestamp = Date.now();

                allPlayers.forEach(player => {
                    if (player.poisonTimer > 0) {
                        player.poisonTimer -= 1;
                        player.poisonTickTimer = (player.poisonTickTimer || 0) + 1;
                        if (player.poisonTickTimer >= 0.3) {
                            player.poisonTickTimer = 0;
                            let oldHp = player.hp;
                            player.hp = Math.max(0, player.hp - 3);
                            if (player.hp < oldHp) {
                                playMinusDamageSound();
                                let tIdx = player.team === 1 ? team1Players : team2Players;
                                showMinusDamageAnimationCard(player.team, tIdx.indexOf(player), 3);
                            }
                            updateAllHpBars(); checkGameWinner();
                        }
                    }

                    if (player.name === 'JIRO' && player.jiroCombo > 0) {
                        if (nowTimestamp - (player.lastJiroHitTime || 0) > 5000) {
                            player.jiroCombo = 0;
                        }
                    }

                    let maxTime = getSkillMaxTime(player.name);
                    let teamPrefix = player.team === 1 ? 't1' : 't2';
                    let idx = (player.team === 1 ? team1Players : team2Players).indexOf(player);
                    const txt = document.getElementById(`gauge-txt-${teamPrefix}-${idx}`);
                    const fill = document.getElementById(`gauge-fill-${teamPrefix}-${idx}`);

                    if (maxTime !== null) {
                        player.skillTimer -= 1;
                        if (player.skillTimer <= 0) {
                            player.skillTimer = maxTime;
                            
                            showToast(`${player.name} 기술 발동`);

                            if (player.name === '미스터비스트') triggerMrBeastSkill(player);
                            else if (player.name === 'JIRO') triggerJiroSkill(player);
                            else if (player.name === '왕클세종') triggerWangklSejongSkill(player);
                            else if (player.name === 'JINO') triggerJinoSkill(player);
                            else if (player.name === '본이') triggerBoniSkill(player);
                            else if (player.name === '동룡쓰') triggerDongryongSkill(player);
                            else if (player.name === '발작아저씨') triggerBaljakSkill(player);
                        }

                        let pct = ((maxTime - player.skillTimer) / maxTime) * 100;
                        if (fill) fill.style.width = pct + '%';
                        if (txt) txt.innerText = `기술 충전중.. ${player.skillTimer}초`;
                    } else {
                        if (txt) txt.innerText = '기술 없음';
                    }
                });

                allPlayers.forEach(player => {
                    if (player.name === '동룡쓰' && player.minions.length > 0) {
                        let enemyTeamBalls = player.team === 1 ? team2Players : team1Players;
                        if (enemyTeamBalls.length > 0) {
                            player.minions.forEach(minion => {
                                minion.attackTimer = (minion.attackTimer || 0) + 1;
                                let targetEnemy = enemyTeamBalls[Math.floor(Math.random() * enemyTeamBalls.length)];
                                if (targetEnemy && targetEnemy.hp > 0) {
                                    if (!minion.isFemale) {
                                        if (minion.attackTimer >= 3) {
                                            minion.attackTimer = 0;
                                            let angle = Math.atan2(targetEnemy.y - minion.y, targetEnemy.x - minion.x);
                                            moneyItems.push({
                                                x: minion.x, y: minion.y,
                                                vx: Math.cos(angle) * 5.5, vy: Math.sin(angle) * 5.5,
                                                radius: 18, damage: 4, isBaconProjectile: true, isFemaleProj: false,
                                                ownerTeam: player.team, caster: player
                                            });
                                            playFoodThrowSound();
                                        }
                                    } else {
                                        if (minion.attackTimer >= 4) {
                                            minion.attackTimer = 0;
                                            let angle = Math.atan2(targetEnemy.y - minion.y, targetEnemy.x - minion.x);
                                            moneyItems.push({
                                                x: minion.x, y: minion.y,
                                                vx: Math.cos(angle) * 4.8, vy: Math.sin(angle) * 4.8,
                                                radius: 24, damage: 6, isBaconProjectile: true, isFemaleProj: true,
                                                ownerTeam: player.team, caster: player
                                            });
                                            playFoodThrowSound();
                                        }
                                    }
                                }
                            });
                        }
                    }

                    if (player.name === 'JINO' && player.skeletons.length > 0) {
                        player.arrowTimer = (player.arrowTimer || 0) + 1;
                        if (player.arrowTimer >= 2) {
                            player.arrowTimer = 0;
                            let enemyTeamBalls = player.team === 1 ? team2Players : team1Players;
                            if (enemyTeamBalls.length > 0) {

        canvas.addEventListener('pointerdown', (e) => {
            if (!isGaming) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = ((e.clientX - rect.left) / rect.width) * canvas.width;
            const clickY = ((e.clientY - rect.top) / rect.height) * canvas.height;
            allPlayers.forEach(player => {
                player.skeletons = player.skeletons.filter(skel => {
                    if (Math.hypot(clickX - skel.x, clickY - skel.y) < skel.radius + 15) {
                        playHitSound();
                        return false;
                    }
                    return true;
                });
            });
        });

        function exitMatch() {
            resetGameUI();
        }

        function resetGameUI() {
            isCountingDown = false;
            if (activeCountdownInterval) clearInterval(activeCountdownInterval);
            isGaming = false; matchEnded = false;
            if (gameInterval) clearInterval(gameInterval);
            moneyItems = []; team1Players = []; team2Players = []; allPlayers = [];

            document.getElementById('lobby-top-menu-bar').classList.remove('hidden');
            document.getElementById('ingame-controls').classList.add('hidden');
            document.getElementById('lobby-controls').classList.remove('hidden');

            initSlotContainers();
        }

        function checkGameWinner() {
            if (matchEnded) return;
            let t1Alive = team1Players.some(p => p.hp > 0);
            let t2Alive = team2Players.some(p => p.hp > 0);

            if (!t1Alive || !t2Alive) {
                matchEnded = true; isGaming = false;
                if (gameInterval) clearInterval(gameInterval);

                if (!t1Alive && !t2Alive) {
                    winnerText = '무승부!';
                } else if (!t2Alive) {
                    winnerText = '파란팀 승!';
                } else {
                    winnerText = '빨간팀 승!';
                }
            }
        }

        function drawBall(x, y, radius, ballObj, auraColor) {
            ctx.save();
            ctx.beginPath(); ctx.arc(x, y, radius + 12, 0, Math.PI * 2);
            ctx.fillStyle = auraColor; ctx.fill();

            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.save(); ctx.clip();
            if (ballObj && ballObj.imageSrc && loadedImages[ballObj.name] && loadedImages[ballObj.name].complete && loadedImages[ballObj.name].naturalWidth !== 0) {
                ctx.drawImage(loadedImages[ballObj.name], x - radius, y - radius, radius * 2, radius * 2);
            } else {
                ctx.fillStyle = '#7f8c8d'; ctx.fill();
            }
            ctx.restore();
            ctx.lineWidth = 3; ctx.strokeStyle = "#000000"; ctx.stroke();
            ctx.restore();
        }

        let isGaming = false, isCountingDown = false, matchEnded = false;
        let countdownText = '', winnerText = '';
        let activeCountdownInterval = null;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const FIXED_SPEED = 4.5;
        const BALL_RADIUS = 31;

        let team1Players = [], team2Players = [], allPlayers = [], moneyItems = [], gameInterval = null;

        function runGameLoop() {
            if (!isGaming && !isCountingDown) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                selectedTeam1Balls.forEach((b, idx) => { if (b) drawBall(calculateMultiPositions(1, idx, currentMatchMode).x, calculateMultiPositions(1, idx, currentMatchMode).y, BALL_RADIUS, b, "rgba(30, 144, 255, 0.15)"); });
                selectedTeam2Balls.forEach((b, idx) => { if (b) drawBall(calculateMultiPositions(2, idx, currentMatchMode).x, calculateMultiPositions(2, idx, currentMatchMode).y, BALL_RADIUS, b, "rgba(231, 76, 60, 0.15)"); });
                requestAnimationFrame(runGameLoop);
                return;
            }

            if (isCountingDown) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                selectedTeam1Balls.forEach((b, idx) => { if (b) drawBall(calculateMultiPositions(1, idx, currentMatchMode).x, calculateMultiPositions(1, idx, currentMatchMode).y, BALL_RADIUS, b, "rgba(30, 144, 255, 0.15)"); });
                selectedTeam2Balls.forEach((b, idx) => { if (b) drawBall(calculateMultiPositions(2, idx, currentMatchMode).x, calculateMultiPositions(2, idx, currentMatchMode).y, BALL_RADIUS, b, "rgba(231, 76, 60, 0.15)"); });

                ctx.save();
                ctx.fillStyle = "rgba(0, 0, 0, 0.35)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = "bold 50px sans-serif"; ctx.fillStyle = "#e74c3c"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 5;
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.strokeText(countdownText, canvas.width / 2, canvas.height / 2);
                ctx.fillText(countdownText, canvas.width / 2, canvas.height / 2);
                ctx.restore();
                requestAnimationFrame(runGameLoop);
                return;
            }

            if (isGaming && !matchEnded) {
                const nowTimestamp = Date.now();

                allPlayers.forEach(p => {
                    if (p.hp <= 0) return;
                    p.lastX = p.x; p.lastY = p.y;
                    
                    let currentSpeed = FIXED_SPEED;
                    if (p.slowTimer && p.slowTimer > nowTimestamp) {
                        currentSpeed = FIXED_SPEED * 0.5;
                    }

                    p.x += p.vx * (currentSpeed / FIXED_SPEED); 
                    p.y += p.vy * (currentSpeed / FIXED_SPEED);

                    let hitWall = false;
                    if (p.x - p.radius < 0) { p.x = p.radius; p.vx = -p.vx; hitWall = true; }
                    if (p.x + p.radius > canvas.width) { p.x = canvas.width - p.radius; p.vx = -p.vx; hitWall = true; }
                    if (p.y - p.radius < 0) { p.y = p.radius; p.vy = -p.vy; hitWall = true; }
                    if (p.y + p.radius > canvas.height) { p.y = canvas.height - p.radius; p.vy = -p.vy; hitWall = true; }
                    
                    let speed = Math.hypot(p.vx, p.vy);
                    if (Math.abs(speed - FIXED_SPEED) > 0.01 && (!p.slowTimer || p.slowTimer <= nowTimestamp)) {
                        p.vx = (p.vx / (speed || 1)) * FIXED_SPEED;
                        p.vy = (p.vy / (speed || 1)) * FIXED_SPEED;
                    }
                    if (hitWall) playWallSound();
                });

                for (let i = 0; i < allPlayers.length; i++) {
                    for (let j = i + 1; j < allPlayers.length; j++) {
                        let p1 = allPlayers[i], p2 = allPlayers[j];
                        if (p1.hp <= 0 || p2.hp <= 0) continue;
                        let dx = p2.x - p1.x, dy = p2.y - p1.y, dist = Math.hypot(dx, dy), minDist = p1.radius + p2.radius;
                        if (dist < minDist) {
                            let overlap = minDist - dist, nx = dx / (dist || 1), ny = dy / (dist || 1);
                            p1.x -= nx * (overlap / 2); p1.y -= ny * (overlap / 2);
                            p2.x += nx * (overlap / 2); p2.y += ny * (overlap / 2);
                            let angle = Math.atan2(ny, nx);

                            let isJiro1 = (p1.name === 'JIRO');
                            let isJiro2 = (p2.name === 'JIRO');

                            if (isJiro1 || isJiro2) {
                                let jiroObj = isJiro1 ? p1 : p2;
                                let otherObj = isJiro1 ? p2 : p1;
                                
                                if (nowTimestamp - (jiroObj.lastJiroHitTime || 0) > 5000) {
                                    jiroObj.jiroCombo = 0;
                                }
                                jiroObj.jiroCombo++;
                                jiroObj.lastJiroHitTime = nowTimestamp;

                                let explosionDmg = 15 + (jiroObj.jiroCombo - 1) * 2;
                                let oldHp = otherObj.hp;
                                otherObj.hp = Math.max(0, otherObj.hp - explosionDmg);
                                if (otherObj.hp < oldHp) {
                                    playMinusDamageSound();
                                    let teamIdx = otherObj.team === 1 ? team1Players : team2Players;
                                    showMinusDamageAnimationCard(otherObj.team, teamIdx.indexOf(otherObj), explosionDmg);
                                }

                                playJiroExplosionSound();

                                jiroObj.comboPopups.push({
                                    text: `콤보 ${jiroObj.jiroCombo}!`,
                                    x: jiroObj.x,
                                    y: jiroObj.y - 35,
                                    alpha: 1.0,
                                    startTime: Date.now()
                                });

                                jiroObj.explosionVisuals.push({ x: otherObj.x, y: otherObj.y, radius: 10, maxRadius: 120, alpha: 1.0, text: `펑!!! (콤보${jiroObj.jiroCombo})` });

                                let knockAngle = Math.atan2(otherObj.y - jiroObj.y, otherObj.x - jiroObj.x);
                                otherObj.vx = Math.cos(knockAngle) * (FIXED_SPEED * 4.2);
                                otherObj.vy = Math.sin(knockAngle) * (FIXED_SPEED * 4.2);
                                p1.vx = -Math.cos(angle) * FIXED_SPEED; p1.vy = -Math.sin(angle) * FIXED_SPEED;
                                p2.vx = Math.cos(angle) * FIXED_SPEED; p2.vy = Math.sin(angle) * FIXED_SPEED;

                                updateAllHpBars(); checkGameWinner();
                            } else {
                                p1.vx = -Math.cos(angle) * FIXED_SPEED; p1.vy = -Math.sin(angle) * FIXED_SPEED;
                                p2.vx = Math.cos(angle) * FIXED_SPEED; p2.vy = Math.sin(angle) * FIXED_SPEED;
                                playHitSound();
                                
                                let oldHp1 = p1.hp, oldHp2 = p2.hp;
                                p1.hp = Math.max(0, p1.hp - 10); 
                                p2.hp = Math.max(0, p2.hp - 10);

                                if (p1.hp < oldHp1) {
                                    playMinusDamageSound();
                                    let tIdx = p1.team === 1 ? team1Players : team2Players;
                                    showMinusDamageAnimationCard(p1.team, tIdx.indexOf(p1), 10);
                                }
                                if (p2.hp < oldHp2) {
                                    playMinusDamageSound();
                                    let tIdx = p2.team === 1 ? team1Players : team2Players;
                                    showMinusDamageAnimationCard(p2.team, tIdx.indexOf(p2), 10);
                                }

                                updateAllHpBars(); checkGameWinner();
                            }
                        }
                    }
                }

                allPlayers.forEach(player => {
                    let enemyTeamBalls = player.team === 1 ? team2Players : team1Players;
                    if (player.name === 'JIRO' && player.mines.length > 0) {
                        player.mines = player.mines.filter(mine => {
                            let triggered = false;
                            enemyTeamBalls.forEach(enemy => {
                                if (enemy.hp <= 0) return;
                                if (Math.hypot(enemy.x - mine.x, enemy.y - mine.y) < enemy.radius + mine.radius) {
                                    triggered = true;
                                    let oldHp = enemy.hp;
                                    enemy.hp = Math.max(0, enemy.hp - 30);
                                    if (enemy.hp < oldHp) {
                                        playMinusDamageSound();
                                        let tIdx = enemy.team === 1 ? team1Players : team2Players;
                                        showMinusDamageAnimationCard(enemy.team, tIdx.indexOf(enemy), 30);
                                    }
                                    playJiroExplosionSound();
                                    
                                    let kbAngle = Math.atan2(enemy.y - mine.y, enemy.x - mine.x);
                                    enemy.vx = Math.cos(kbAngle) * (FIXED_SPEED * 4.5);
                                    enemy.vy = Math.sin(kbAngle) * (FIXED_SPEED * 4.5);

                                    player.explosionVisuals.push({ x: mine.x, y: mine.y, radius: 15, maxRadius: 140, alpha: 1.0, text: '팡!!!!!!' });
                                    updateAllHpBars(); checkGameWinner();
                                }
                            });
                            return !triggered;
                        });
                    }
                });

                allPlayers.forEach(player => {
                    let enemyTeamBalls = player.team === 1 ? team2Players : team1Players;
                    player.skeletons.forEach(skel => {
                        enemyTeamBalls.forEach(enemy => {
                            if (enemy.hp > 0) {
                                let dx = enemy.x - skel.x, dy = enemy.y - skel.y, dist = Math.hypot(dx, dy);
                                if (dist < enemy.radius + skel.radius) {
                                    let lastHit = skel.lastHitTime || 0;
                                    if (nowTimestamp - lastHit >= 1000) {
                                        let oldHp = enemy.hp;
                                        enemy.hp = Math.max(0, enemy.hp - 4);
                                        if (enemy.hp < oldHp) {
                                            playMinusDamageSound();
                                            let tIdx = enemy.team === 1 ? team1Players : team2Players;
                                            showMinusDamageAnimationCard(enemy.team, tIdx.indexOf(enemy), 4);
                                        }
                                        skel.lastHitTime = nowTimestamp;
                                        playHitSound(); updateAllHpBars(); checkGameWinner();
                                    }
                                }
                            }
                        });
                    });
                });

                allPlayers.forEach(player => {
                    player.explosionVisuals.forEach(ev => {
                        ev.radius += 5;
                        ev.alpha -= 0.025;
                    });
                    player.explosionVisuals = player.explosionVisuals.filter(ev => ev.alpha > 0);

                    player.comboPopups.forEach(cp => {
                        let elapsed = (Date.now() - cp.startTime) / 1000;
                        cp.y -= 0.6;
                        cp.alpha = Math.max(0, 1.0 - (elapsed / 2.5));
                    });
                    player.comboPopups = player.comboPopups.filter(cp => cp.alpha > 0);
                });

                allPlayers.forEach(caster => {
                    let enemyBalls = caster.team === 1 ? team2Players : team1Players;
                    for (let i = caster.bombs.length - 1; i >= 0; i--) {
                        let bomb = caster.bombs[i];
                        if (bomb.progress < 1) {
                            bomb.progress += 0.03;
                            bomb.x = bomb.startX + (bomb.destX - bomb.startX) * bomb.progress;
                            bomb.y = bomb.startY + (bomb.destY - bomb.startY) * bomb.progress;
                        } else {
                            if (!bomb.startTime) {
                                bomb.startTime = nowTimestamp;
                                playBoniBombSound();
                            }
                            enemyBalls.forEach(enemy => {
                                if (enemy.hp <= 0) return;
                                if (Math.hypot(enemy.x - bomb.destX, enemy.y - bomb.destY) <= bomb.radius + enemy.radius) {
                                    let oldHp = enemy.hp;
                                    enemy.hp = Math.max(0, enemy.hp - 15);
                                    if (enemy.hp < oldHp) {
                                        playMinusDamageSound();
                                        let tIdx = enemy.team === 1 ? team1Players : team2Players;
                                        showMinusDamageAnimationCard(enemy.team, tIdx.indexOf(enemy), 15);
                                    }
                                    
                                    let kbAngle = Math.atan2(enemy.y - bomb.destY, enemy.x - bomb.destX);
                                    enemy.vx = Math.cos(kbAngle) * (FIXED_SPEED * 3.5);
                                    enemy.vy = Math.sin(kbAngle) * (FIXED_SPEED * 3.5);

                                    updateAllHpBars(); 
                                    playBoniBombSound(); 
                                    checkGameWinner();
                                    caster.bombs.splice(i, 1);
                                }
                            });
                            if (nowTimestamp - bomb.startTime >= 3000) {
                                caster.bombs.splice(i, 1);
                            }
                        }
                    }
                });

                for (let i = moneyItems.length - 1; i >= 0; i--) {
                    let m = moneyItems[i];
                    
                    if (m.isHangeulLetter) {
                        if (nowTimestamp - m.spawnTime > 12000) { moneyItems.splice(i, 1); continue; }
                        let eaten = false;
                        let enemyBalls = m.ownerTeam === 1 ? team2Players : team1Players;

                        allPlayers.forEach(player => {
                            if (eaten || player.hp <= 0) return;
                            let dist = Math.hypot(player.x - m.x, player.y - m.y);
                            if (dist < player.radius + m.radius) {
                                if (player.team === m.ownerTeam) {
                                    playHealSound();
                                    let aliveEnemies = enemyBalls.filter(e => e.hp > 0);
                                    if (aliveEnemies.length > 0) {
                                        let targetEnemy = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
                                        let oldHp = targetEnemy.hp;
                                        targetEnemy.hp = Math.max(0, targetEnemy.hp - m.damage);
                                        if (targetEnemy.hp < oldHp) {
                                            playMinusDamageSound();
                                            let tIdx = targetEnemy.team === 1 ? team1Players : team2Players;
                                            showMinusDamageAnimationCard(targetEnemy.team, tIdx.indexOf(targetEnemy), m.damage);
                                        }
                                    }
                                    player.hp = Math.min(player.maxHp, player.hp + m.healAmount);
                                    let teamIdx = player.team === 1 ? team1Players : team2Players;
                                    showHealingAnimationCard(player.team, teamIdx.indexOf(player), m.healAmount);
                                    
                                    eaten = true; updateAllHpBars(); checkGameWinner();
                                } else {
                                    eaten = true;
                                }
                            }
                        });
                        if (eaten) moneyItems.splice(i, 1);
                    } else if (m.isChocolateItem) {
                        if (nowTimestamp - m.spawnTime > 5000) { moneyItems.splice(i, 1); continue; }
                        let eaten = false;
                        let enemyTeamBalls = m.ownerTeam === 1 ? team2Players : team1Players;

                        allPlayers.forEach(player => {
                            if (eaten || player.hp <= 0) return;
                            if (Math.hypot(player.x - m.x, player.y - m.y) < player.radius + m.radius) {
                                if (player.team === m.ownerTeam && player.name === '미스터비스트') {
                                    playHealSound();
                                    player.hp = Math.min(player.maxHp, player.hp + 10);
                                    let teamIdx = player.team === 1 ? team1Players : team2Players;
                                    showHealingAnimationCard(player.team, teamIdx.indexOf(player), 10);

                                    enemyTeamBalls.forEach(enemy => {
                                        if (enemy.hp > 0) {
                                            enemy.poisonTimer = 2;
                                            enemy.poisonTickTimer = 0;
                                        }
                                    });

                                    eaten = true; updateAllHpBars();
                                }
                            }
                        });
                        if (eaten) moneyItems.splice(i, 1);
                    } else if (m.isMoneyBag) {
                        if (nowTimestamp - m.spawnTime > 4000) { moneyItems.splice(i, 1); continue; }
                        let eaten = false;
                        allPlayers.forEach(player => {
                            if (eaten || player.hp <= 0) return;
                            if (Math.hypot(player.x - m.x, player.y - m.y) < player.radius + m.radius) {
                                if (player.team === m.ownerTeam && player.name === '미스터비스트') {
                                    playHealSound();
                                    let teamIdx = player.team === 1 ? team1Players : team2Players;
                                    player.hp = Math.min(player.maxHp, player.hp + 25);
                                    showHealingAnimationCard(player.team, teamIdx.indexOf(player), 25);
                                    
                                    const spd = 4.5;
                                    const dirs8 = [
                                        {vx: 0, vy: -spd},
                                        {vx: 0, vy: spd},
                                        {vx: -spd, vy: 0},
                                        {vx: spd, vy: 0},
                                        {vx: spd, vy: spd},
                                        {vx: -spd, vy: spd},
                                        {vx: spd, vy: -spd},
                                        {vx: -spd, vy: -spd}
                                    ];

                                    dirs8.forEach(dir => {
                                        moneyItems.push({
                                            x: player.x, y: player.y,
                                            vx: dir.vx, vy: dir.vy,
                                            radius: 20, damage: 20, isMoneyBullet: true,
                                            ownerTeam: player.team, caster: player, spawnTime: Date.now()
                                        });
                                    });

                                    playCoinSound();
                                    eaten = true; updateAllHpBars(); checkGameWinner();
                                }
                            }
                        });
                        if (eaten) moneyItems.splice(i, 1);
                    } else if (m.isMoneyBullet) {
                        m.x += m.vx; m.y += m.vy;
                        if (m.x < 0 || m.x > canvas.width || m.y < 0 || m.y > canvas.height) {
                            playJiroExplosionSound();
                            if (m.caster) {
                                m.caster.explosionVisuals.push({ x: m.x, y: m.y, radius: 10, maxRadius: 80, alpha: 1.0, text: '펑!' });
                            }
                            moneyItems.splice(i, 1);
                            continue;
                        }
                        let hitEnemy = false;
                        let enemyTeamBalls = m.ownerTeam === 1 ? team2Players : team1Players;
                        enemyTeamBalls.forEach(enemy => {
                            if (enemy.hp <= 0) return;
                            if (Math.hypot(enemy.x - m.x, enemy.y - m.y) < m.radius + enemy.radius) {
                                let oldHp = enemy.hp;
                                enemy.hp = Math.max(0, enemy.hp - 20);
                                if (enemy.hp < oldHp) {
                                    playMinusDamageSound();
                                    let tIdx = enemy.team === 1 ? team1Players : team2Players;
                                    showMinusDamageAnimationCard(enemy.team, tIdx.indexOf(enemy), 20);
                                }
                                playJiroExplosionSound();
                                if (m.caster) {
                                    m.caster.explosionVisuals.push({ x: m.x, y: m.y, radius: 10, maxRadius: 100, alpha: 1.0, text: '펑! (-20)' });
                                }
                                updateAllHpBars(); checkGameWinner();
                                hitEnemy = true;
                            }
                        });
                        if (hitEnemy) {
                            moneyItems.splice(i, 1);
                        }
                    } else if (m.isArrow || m.isBaconProjectile) {
                        m.x += m.vx; m.y += m.vy;
                        if (m.x < 0 || m.x > canvas.width || m.y < 0 || m.y > canvas.height) { moneyItems.splice(i, 1); continue; }
                        let enemyTeamBalls = m.ownerTeam === 1 ? team2Players : team1Players;
                        enemyTeamBalls.forEach(enemy => {
                            if (enemy.hp <= 0) return;
                            if (Math.hypot(enemy.x - m.x, enemy.y - m.y) < m.radius + enemy.radius) {
                                let oldHp = enemy.hp;
                                enemy.hp = Math.max(0, enemy.hp - m.damage);
                                if (enemy.hp < oldHp) {
                                    playMinusDamageSound();
                                    let tIdx = enemy.team === 1 ? team1Players : team2Players;
                                    showMinusDamageAnimationCard(enemy.team, tIdx.indexOf(enemy), m.damage);
                                }
                                if (m.isBaconProjectile && !m.isFemaleProj) {
                                    enemy.slowTimer = nowTimestamp + 3000;
                                } else if (m.isBaconProjectile && m.isFemaleProj) {
                                    let kbAngle = Math.atan2(enemy.y - m.y, enemy.x - m.x);
                                    enemy.vx = Math.cos(kbAngle) * (FIXED_SPEED * 3.2);
                                    enemy.vy = Math.sin(kbAngle) * (FIXED_SPEED * 3.2);
                                }
                                playHitSound(); updateAllHpBars(); checkGameWinner();
                                moneyItems.splice(i, 1);
                            }
                        });
                    }
                }
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 로비 화면일 때 선택한 볼 미리보기 렌더링
            if (!isGaming && !isCountingDown) {
                selectedTeam1Balls.forEach((b, idx) => {
                    if (b) {
                        let pos = calculateMultiPositions(1, idx, currentMatchMode);
                        drawBall(pos.x, pos.y, BALL_RADIUS, b, "rgba(30, 144, 255, 0.15)");
                    }
                });
                selectedTeam2Balls.forEach((b, idx) => {
                    if (b) {
                        let pos = calculateMultiPositions(2, idx, currentMatchMode);
                        drawBall(pos.x, pos.y, BALL_RADIUS, b, "rgba(231, 76, 60, 0.15)");
                    }
                });
            }

            allPlayers.forEach(player => {
                let teamColorHex = player.team === 1 ? '#1e90ff' : '#e74c3c';

                player.mines.forEach(mine => {
                    ctx.save();
                    let elapsed = Date.now() - mine.spawnTime;
                    let alpha = elapsed > 2000 ? 0.3 : 0.92;
                    ctx.beginPath(); ctx.arc(mine.x, mine.y, mine.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`; ctx.fill();
                    ctx.lineWidth = 4; ctx.strokeStyle = teamColorHex; ctx.stroke();
                    
                    ctx.font = "bold 16px sans-serif"; ctx.fillStyle = teamColorHex;
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText("지뢰", mine.x, mine.y);
                    ctx.restore();
                });

                player.explosionVisuals.forEach(ev => {
                    ctx.save();
                    ctx.beginPath(); ctx.arc(ev.x, ev.y, ev.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(231, 76, 60, ${ev.alpha * 0.4})`; ctx.fill();
                    ctx.lineWidth = 4; ctx.strokeStyle = `rgba(241, 196, 15, ${ev.alpha})`; ctx.stroke();
                    ctx.font = "bold 24px sans-serif"; ctx.fillStyle = `rgba(255, 255, 255, ${ev.alpha})`; ctx.strokeStyle = `rgba(0,0,0,${ev.alpha})`; ctx.lineWidth = 4;
                    ctx.textAlign = "center"; ctx.strokeText(ev.text, ev.x, ev.y - 30); ctx.fillText(ev.text, ev.x, ev.y - 30);
                    ctx.restore();
                });

                player.comboPopups.forEach(cp => {
                    ctx.save();
                    ctx.font = "bold 20px sans-serif";
                    ctx.fillStyle = `rgba(241, 196, 15, ${cp.alpha})`;
                    ctx.strokeStyle = `rgba(0, 0, 0, ${cp.alpha})`;
                    ctx.lineWidth = 4;
                    ctx.textAlign = "center";
                    ctx.strokeText(cp.text, cp.x, cp.y);
                    ctx.fillText(cp.text, cp.x, cp.y);
                    ctx.restore();
                });

                player.minions.forEach(m => {
                    m.orbitAngle += 0.05;
                    m.x = player.x + Math.cos(m.orbitAngle) * m.orbitDist;
                    m.y = player.y + Math.sin(m.orbitAngle) * m.orbitDist;

                    ctx.save();
                    ctx.beginPath(); ctx.arc(m.x, m.y, m.radius + 8, 0, Math.PI * 2);
                    ctx.strokeStyle = teamColorHex; ctx.lineWidth = 3; ctx.stroke();

                    ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
                    ctx.save(); 
                    ctx.clip();
                    if (m.img && m.img.complete && m.img.naturalWidth !== 0) {
                        ctx.drawImage(m.img, m.x - m.radius, m.y - m.radius, m.radius * 2, m.radius * 2);
                    } else {
                        ctx.fillStyle = m.isFemale ? '#e74c3c' : '#3498db'; ctx.fill();
                    }
                    ctx.restore();
                    ctx.lineWidth = 3; ctx.strokeStyle = "#000000"; ctx.stroke();
                    ctx.restore();
                });

                player.skeletons.forEach(skel => {
                    ctx.save();
                    if (skeletonImg.complete && skeletonImg.naturalWidth !== 0) {
                        ctx.drawImage(skeletonImg, skel.x - 24, skel.y - 32, 48, 64);
                    } else {
                        ctx.fillStyle = '#bdc3c7'; ctx.fillRect(skel.x - 18, skel.y - 28, 36, 56);
                    }
                    ctx.restore();
                });

                player.bombs.forEach(bomb => {
                    ctx.save();
                    ctx.beginPath(); ctx.arc(bomb.destX, bomb.destY, bomb.radius, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(231, 76, 60, 0.22)"; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = teamColorHex; ctx.stroke();
                    ctx.font = "30px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("💣", bomb.x, bomb.y);
                    if (bomb.startTime) {
                        let remainSec = Math.max(0, Math.ceil(3 - (Date.now() - bomb.startTime) / 1000));
                        ctx.font = "bold 16px sans-serif"; ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#000000"; ctx.lineWidth = 3;
                        ctx.strokeText(`${remainSec}초`, bomb.destX, bomb.destY - bomb.radius - 10);
                        ctx.fillText(`${remainSec}초`, bomb.destX, bomb.destY - bomb.radius - 10);
                    }
                    ctx.restore();
                });

                if (player.rouletteAnim) {
                    ctx.save();
                    ctx.font = "bold 20px sans-serif";
                    ctx.fillStyle = "#f1c40f";
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = 4;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "bottom";
                    ctx.strokeText(`🎰 ${player.rouletteAnim.text}`, player.x, player.y - player.radius - 10);
                    ctx.fillText(`🎰 ${player.rouletteAnim.text}`, player.x, player.y - player.radius - 10);
                    ctx.restore();
                }
            });

            moneyItems.forEach(m => {
                ctx.save();
                let teamColorHex = m.ownerTeam === 1 ? '#1e90ff' : '#e74c3c';

                if (m.isHangeulLetter) {
                    ctx.font = "bold 26px sans-serif"; 
                    ctx.fillStyle = "#e74c3c";
                    ctx.textAlign = "center"; 
                    ctx.textBaseline = "middle"; 
                    ctx.fillText(m.char, m.x, m.y);
                } else {
                    if (m.isChocolateItem) {
                        ctx.beginPath(); ctx.arc(m.x, m.y, m.radius + 10, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(155, 89, 182, 0.45)'; ctx.fill();
                        ctx.beginPath(); ctx.arc(m.x, m.y, m.radius + 5, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(142, 68, 173, 0.65)'; ctx.fill();
                    } else {
                        ctx.beginPath(); ctx.arc(m.x, m.y, m.radius + 6, 0, Math.PI * 2);
                        ctx.strokeStyle = teamColorHex; ctx.lineWidth = 3; ctx.stroke();
                    }

                    if (m.isChocolateItem) {
                        let remainTime = Math.max(0, Math.ceil(5 - (Date.now() - m.spawnTime) / 1000));
                        ctx.font = "26px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("🍫", m.x, m.y);
                        ctx.font = "bold 12px sans-serif"; ctx.fillStyle = "#c0392b"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
                        ctx.strokeText(`${remainTime}초`, m.x, m.y - 18); ctx.fillText(`${remainTime}초`, m.x, m.y - 18);
                    } else if (m.isMoneyBag) {
                        let remainTime = Math.max(0, Math.ceil(4 - (Date.now() - m.spawnTime) / 1000));
                        ctx.font = "28px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("💰", m.x, m.y);
                        ctx.font = "bold 13px sans-serif"; ctx.fillStyle = "#e67e22"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
                        ctx.strokeText(`${remainTime}초`, m.x, m.y - 20); ctx.fillText(`${remainTime}초`, m.x, m.y - 20);
                    } else if (m.isMoneyBullet) {
                        ctx.font = "24px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("💸", m.x, m.y);
                    } else if (m.isArrow) {
                        ctx.save();
                        ctx.translate(m.x, m.y);
                        ctx.rotate(m.angle);
                        if (arrowImg.complete && arrowImg.naturalWidth !== 0) {
                            ctx.drawImage(arrowImg, -36, -20, 72, 40);
                        } else {
                            ctx.fillStyle = '#8b4513'; ctx.fillRect(-28, -6, 56, 12);
                        }
                        ctx.restore();
                    } else if (m.isBaconProjectile) {
                        if (m.isFemaleProj) {
                            ctx.font = "36px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                            ctx.fillText("💣", m.x, m.y);
                        } else {
                            ctx.font = "32px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                            ctx.fillText("🥓", m.x, m.y);
                        }
                    }
                }
                ctx.restore();
            });

            allPlayers.forEach(player => {
                if (player.hp > 0) drawBall(player.x, player.y, player.radius, player.ballData, player.team === 1 ? "rgba(30, 144, 255, 0.15)" : "rgba(231, 76, 60, 0.15)");
            });

            if (matchEnded) {
                ctx.save();
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = "bold 45px sans-serif"; ctx.fillStyle = "#ffffff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2);
                ctx.restore();
            }

            requestAnimationFrame(runGameLoop);
        }

        requestAnimationFrame(runGameLoop);
    </script>
</body>
</html>
