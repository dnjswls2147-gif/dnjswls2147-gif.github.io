<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>릴리 볼 파이트</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; /* 터치 시 파란색 잔상 제거 */
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            touch-action: none; /* 화면 스크롤/바운싱 완전 고정 */
        }
        html, body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 화면 정중앙 고정 */
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* 메인 컨테이너 (화면 너비를 98%까지 최대로 넓혀 3배 크게 확대) */
        .app-container {
            width: 98vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 중앙 경기장 사각형 뷰포트 (최대 크기로 대폭 확대) */
        .arena-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 6px solid #000000;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 추가하기 / 공 선택 슬롯 영역 */
        .slot-container {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 18px;
        }
        .btn-add-slot {
            flex: 1;
            padding: 22px 0;
            background: #555555;
            color: #ffffff;
            border: 4px solid #000000;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            outline: none;
        }
        .btn-add-slot.selected {
            background: #27ae60;
        }

        /* 시작하기 / 나가기 버튼 */
        .btn-main-action {
            margin-top: 20px;
            width: 90%;
            padding: 22px 0;
            font-size: 32px;
            font-weight: 900;
            border: 4px solid #000000;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 0 #000000;
            outline: none;
        }
        .btn-start { background-color: #2ecc71; color: #ffffff; }
        .btn-exit { background-color: #e74c3c; color: #ffffff; }
        .btn-main-action:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #000000;
        }

        /* 인게임 HP 바 영역 */
        .ingame-status-panel {
            width: 100%;
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .status-row-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .player-status-card {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .player-name-label {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 6px;
        }
        .player-name-p1 { color: #1e90ff; }
        .player-name-p2 { color: #e74c3c; text-align: right; }

        .hp-bar-outer {
            width: 100%;
            height: 38px;
            background: #e0e0e0;
            border: 4px solid #000000;
            position: relative;
            overflow: hidden;
        }
        .hp-bar-inner {
            height: 100%;
            background: #2ecc71;
            width: 100%;
            transition: width 0.15s;
        }
        .hp-text-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 1px 1px 2px #000;
        }
        .sub-gauge-bar {
            width: 100%;
            height: 9px;
            background: #cccccc;
            border: 1.5px solid #000000;
            margin-top: 4px;
        }
        .sub-gauge-fill {
            height: 100%;
            background: #4a90e2;
            width: 0%;
        }

        /* 볼 선택 모달 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal-overlay.hidden { display: none !important; }

        .picker-modal-box {
            width: 90vw;
            max-width: 500px;
            background: #ffffff;
            border: 5px solid #000000;
            padding: 24px;
            position: relative;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }
        .modal-close-btn {
            position: absolute;
            top: 14px; right: 14px;
            width: 44px; height: 44px;
            border: 3px solid #000000;
            background: #ffffff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .picker-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 45px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .ball-select-btn {
            background: #4a4a4a;
            color: #ffffff;
            border: 3.5px solid #000000;
            padding: 22px 10px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            outline: none;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 메인 컨테이너 -->
    <div class="app-container">

        <!-- 경기장 뷰포트 사각형 -->
        <div class="arena-frame">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
        </div>

        <!-- 로비 대기 화면 -->
        <div id="lobby-controls" style="width:100%; display:flex; flex-direction:column; align-items:center;">
            <div class="slot-container">
                <button class="btn-add-slot" id="slot-left-btn" onclick="handleSlotClick('left')">추가하기</button>
                <button class="btn-add-slot" id="slot-right-btn" onclick="handleSlotClick('right')">추가하기</button>
            </div>
            <button class="btn-main-action btn-start" onclick="startMatch()">시작하기 ▶</button>
        </div>

        <!-- 인게임 대결 화면 -->
        <div id="ingame-controls" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
            <div class="ingame-status-panel">
                <div class="status-row-group">
                    <div class="player-status-card">
                        <div class="player-name-label player-name-p1" id="p1-name-txt">동룡쓰 볼</div>
                        <div class="hp-bar-outer">
                            <div class="hp-bar-inner" id="p1-hp-fill"></div>
                            <div class="hp-text-overlay" id="p1-hp-txt">250 / 250</div>
                        </div>
                        <div class="sub-gauge-bar"><div class="sub-gauge-fill" style="width:70%;"></div></div>
                    </div>
                    <div class="player-status-card">
                        <div class="player-name-label player-name-p2" id="p2-name-txt">미스터비스트 볼</div>
                        <div class="hp-bar-outer">
                            <div class="hp-bar-inner" id="p2-hp-fill"></div>
                            <div class="hp-text-overlay" id="p2-hp-txt">250 / 250</div>
                        </div>
                        <div class="sub-gauge-bar"><div class="sub-gauge-fill" style="width:40%;"></div></div>
                    </div>
                </div>
            </div>
            <button class="btn-main-action btn-exit" onclick="exitMatch()">나가기 🚪</button>
        </div>

    </div>

    <!-- 볼 선택 모달 팝업창 -->
    <div class="modal-overlay hidden" id="ball-picker-modal">
        <div class="picker-modal-box">
            <button class="modal-close-btn" onclick="closeBallPicker()">✕</button>
            <div class="picker-grid" id="ball-picker-grid"></div>
        </div>
    </div>

    <script>
        // 카카오톡 브라우저 강제 이동 (고정 유지)
        (function forceOpenInChrome() {
            const userAgent = navigator.userAgent.toLowerCase();
            const targetUrl = location.href;

            if (userAgent.indexOf('kakaotalk') !== -1) {
                if (userAgent.indexOf('android') !== -1) {
                    location.href = 'intent://' + targetUrl.replace(/https?:\/\//i, '') + '#Intent;scheme=http;package=com.android.chrome;end';
                } else if (userAgent.indexOf('iphone') !== -1 || userAgent.indexOf('ipad') !== -1) {
                    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(targetUrl);
                }
            }
        })();

        // 화면 이동/스크롤 완전 고정
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        const ballList = [
            { name: '동룡쓰 볼', hp: 250, color: '#1e90ff' },
            { name: '미스터비스트 볼', hp: 250, color: '#e74c3c' },
            { name: '상품컴퍼니 볼', hp: 250, color: '#f1c40f' }
        ];

        let selectedLeftBall = null;
        let selectedRightBall = null;
        let currentTargetSide = null;

        let isGaming = false;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let p1 = { x: 150, y: 250, radius: 42, vx: 3.5, vy: 3, hp: 250, maxHp: 250, name: '', color: '#1e90ff' };
        let p2 = { x: 350, y: 250, radius: 42, vx: -3, vy: 3.5, hp: 250, maxHp: 250, name: '', color: '#e74c3c' };

        function handleSlotClick(side) {
            if (side === 'left') {
                if (selectedLeftBall) {
                    selectedLeftBall = null;
                    p1.name = '';
                    const slotBtn = document.getElementById('slot-left-btn');
                    slotBtn.innerText = '추가하기';
                    slotBtn.classList.remove('selected');
                    drawPreview();
                } else {
                    openBallPicker('left');
                }
            } else if (side === 'right') {
                if (selectedRightBall) {
                    selectedRightBall = null;
                    p2.name = '';
                    const slotBtn = document.getElementById('slot-right-btn');
                    slotBtn.innerText = '추가하기';
                    slotBtn.classList.remove('selected');
                    drawPreview();
                } else {
                    openBallPicker('right');
                }
            }
        }

        function openBallPicker(side) {
            currentTargetSide = side;
            const grid = document.getElementById('ball-picker-grid');
            grid.innerHTML = '';

            ballList.forEach(ball => {
                const btn = document.createElement('div');
                btn.className = 'ball-select-btn';
                btn.innerText = ball.name;
                btn.onclick = () => chooseBall(ball);
                grid.appendChild(btn);
            });

            document.getElementById('ball-picker-modal').classList.remove('hidden');
        }

        function closeBallPicker() {
            document.getElementById('ball-picker-modal').classList.add('hidden');
        }

        function chooseBall(ball) {
            if (currentTargetSide === 'left') {
                selectedLeftBall = ball;
                p1.name = ball.name;
                p1.color = ball.color;
                const slotBtn = document.getElementById('slot-left-btn');
                slotBtn.innerText = ball.name;
                slotBtn.classList.add('selected');
            } else {
                selectedRightBall = ball;
                p2.name = ball.name;
                p2.color = ball.color;
                const slotBtn = document.getElementById('slot-right-btn');
                slotBtn.innerText = ball.name;
                slotBtn.classList.add('selected');
            }
            closeBallPicker();
            drawPreview();
        }

        function drawPreview() {
            if (isGaming) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (selectedLeftBall) {
                drawBall(150, 250, p1.radius, selectedLeftBall.color, selectedLeftBall.name, "rgba(30, 144, 255, 0.15)");
            }

            if (selectedRightBall) {
                drawBall(350, 250, p2.radius, selectedRightBall.color, selectedRightBall.name, "rgba(231, 76, 60, 0.15)");
            }
        }

        function drawBall(x, y, radius, color, name, auraColor) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, radius + 22, 0, Math.PI * 2);
            ctx.fillStyle = auraColor;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.lineWidth = 4.5;
            ctx.strokeStyle = "#000000";
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 15px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(name, x, y);
            ctx.restore();
        }

        function startMatch() {
            if (!selectedLeftBall || !selectedRightBall) {
                alert('양쪽 공을 모두 선택해 주세요!');
                return;
            }

            p1.maxHp = selectedLeftBall.hp;
            p1.hp = selectedLeftBall.hp;
            p1.x = 150; p1.y = 250;
            p1.vx = 3.5; p1.vy = 3;

            p2.maxHp = selectedRightBall.hp;
            p2.hp = selectedRightBall.hp;
            p2.x = 350; p2.y = 250;
            p2.vx = -3; p2.vy = 3.5;

            document.getElementById('p1-name-txt').innerText = p1.name;
            document.getElementById('p2-name-txt').innerText = p2.name;

            document.getElementById('lobby-controls').classList.add('hidden');
            document.getElementById('ingame-controls').classList.remove('hidden');

            isGaming = true;
            updateHpBars();
        }

        function exitMatch() {
            isGaming = false;
            document.getElementById('ingame-controls').classList.add('hidden');
            document.getElementById('lobby-controls').classList.remove('hidden');
            drawPreview();
        }

        function updateHpBars() {
            const p1Pct = Math.max(0, (p1.hp / p1.maxHp) * 100);
            const p2Pct = Math.max(0, (p2.hp / p2.maxHp) * 100);

            document.getElementById('p1-hp-fill').style.width = p1Pct + '%';
            document.getElementById('p1-hp-txt').innerText = `${Math.ceil(p1.hp)} / ${p1.maxHp}`;

            document.getElementById('p2-hp-fill').style.width = p2Pct + '%';
            document.getElementById('p2-hp-txt').innerText = `${Math.ceil(p2.hp)} / ${p2.maxHp}`;
        }

        function runGameLoop() {
            if (isGaming) {
                p1.x += p1.vx; p1.y += p1.vy;
                p2.x += p2.vx; p2.y += p2.vy;

                if (p1.x - p1.radius < 0 || p1.x + p1.radius > canvas.width) p1.vx *= -1;
                if (p1.y - p1.radius < 0 || p1.y + p1.radius > canvas.height) p1.vy *= -1;
                if (p2.x - p2.radius < 0 || p2.x + p2.radius > canvas.width) p2.vx *= -1;
                if (p2.y - p2.radius < 0 || p2.y + p2.radius > canvas.height) p2.vy *= -1;

                let dx = p2.x - p1.x;
                let dy = p2.y - p1.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < p1.radius + p2.radius) {
                    let tempVx = p1.vx; let tempVy = p1.vy;
                    p1.vx = p2.vx; p1.vy = p2.vy;
                    p2.vx = tempVx; p2.vy = tempVy;

                    p1.hp = Math.max(0, p1.hp - 10);
                    p2.hp = Math.max(0, p2.hp - 10);
                    updateHpBars();

                    if (p1.hp <= 0 || p2.hp <= 0) {
                        isGaming = false;
                        setTimeout(() => {
                            if (p1.hp <= 0 && p2.hp <= 0) {
                                alert('🤝 무승부!');
                            } else {
                                alert(p1.hp > 0 ? `🏆 ${p1.name} 승리!` : `🏆 ${p2.name} 승리!`);
                            }
                            exitMatch();
                        }, 100);
                    }
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawBall(p1.x, p1.y, p1.radius, p1.color, p1.name, "rgba(30, 144, 255, 0.15)");
                drawBall(p2.x, p2.y, p2.radius, p2.color, p2.name, "rgba(231, 76, 60, 0.15)");
            }

            requestAnimationFrame(runGameLoop);
        }

        requestAnimationFrame(runGameLoop);
    </script>
</body>
</html>
