<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>릴리 볼 파이트 - 커스텀 볼 에디션</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        }
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            color: #111111;
        }

        /* 상단 아이콘 네비게이션 바 */
        .top-icon-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 420px;
            padding: 6px 4px;
            margin-bottom: 8px;
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
        }
        .icon-btn-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .icon-btn {
            background: none;
            border: 1.5px solid #666666;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            padding: 0;
        }
        .currency-badge {
            background: #ffffff;
            border: 1.5px solid #333333;
            border-radius: 14px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .coin-icon {
            background: #000000;
            color: #ffffff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        /* 메인 컨테이너 */
        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* 중앙 경기장 사각형 뷰포트 */
        .arena-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 3px solid #000000;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 플로팅 채팅 아이콘 */
        .floating-chat-btn {
            position: absolute;
            right: -8px;
            top: 45%;
            width: 40px;
            height: 40px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            cursor: pointer;
            z-index: 10;
        }

        /* 추가하기 슬롯 영역 */
        .slot-container {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 10px;
        }
        .btn-add-slot {
            flex: 1;
            padding: 14px 0;
            background: #555555;
            color: #ffffff;
            border: 2px solid #000000;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-add-slot.selected {
            background: #27ae60;
        }

        /* 시작하기 / 나가기 버튼 */
        .btn-main-action {
            margin-top: 20px;
            width: 65%;
            max-width: 250px;
            padding: 12px 0;
            font-size: 18px;
            font-weight: 900;
            border: 2px solid #000000;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 0 #000000;
        }
        .btn-start { background-color: #2ecc71; color: #ffffff; }
        .btn-exit { background-color: #e74c3c; color: #ffffff; border-radius: 8px; }

        /* 인게임 HP 및 게이지 바 영역 */
        .ingame-status-panel {
            width: 100%;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .status-row-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .player-status-card {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .player-name-label {
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 3px;
        }
        .player-name-p1 { color: #1e90ff; }
        .player-name-p2 { color: #9b59b6; text-align: right; }

        .hp-bar-outer {
            width: 100%;
            height: 22px;
            background: #e0e0e0;
            border: 2px solid #000000;
            position: relative;
            overflow: hidden;
        }
        .hp-bar-inner {
            height: 100%;
            background: #2ecc71;
            width: 100%;
            transition: width 0.15s;
        }
        .hp-text-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 12px;
            text-shadow: 1px 1px 2px #000;
        }
        .sub-gauge-bar {
            width: 100%;
            height: 5px;
            background: #cccccc;
            border: 1px solid #000000;
            margin-top: 2px;
        }
        .sub-gauge-fill {
            height: 100%;
            background: #4a90e2;
            width: 0%;
        }

        /* 하단 푸터 정보 */
        .footer-info {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            color: #777777;
            line-height: 1.5;
        }

        /* 볼 선택 모달 (2열 그리드) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal-overlay.hidden { display: none !important; }

        .picker-modal-box {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border: 3px solid #000000;
            padding: 15px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-close-btn {
            position: absolute;
            top: 10px; right: 10px;
            width: 30px; height: 30px;
            border: 2px solid #000000;
            background: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .picker-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 30px;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .ball-select-btn {
            background: #4a4a4a;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 12px 6px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 상단 아이콘 바 -->
    <div class="top-icon-bar">
        <div class="icon-btn-group">
            <button class="icon-btn">👤</button>
            <button class="icon-btn">🎖️</button>
            <button class="icon-btn">✉️</button>
            <button class="icon-btn">📅</button>
            <button class="icon-btn">🆚</button>
        </div>
        <div class="currency-badge">
            <span class="coin-icon">B</span>
            <span>437</span>
        </div>
        <div class="icon-btn-group">
            <button class="icon-btn">🏪</button>
            <button class="icon-btn">💭</button>
            <button class="icon-btn">📋</button>
        </div>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="app-container">

        <!-- 경기장 뷰포트 사각형 -->
        <div class="arena-frame">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <button class="floating-chat-btn">💬</button>
        </div>

        <!-- 로비 대기 화면 -->
        <div id="lobby-controls" style="width:100%; display:flex; flex-direction:column; align-items:center;">
            <div class="slot-container">
                <button class="btn-add-slot" id="slot-left-btn" onclick="openBallPicker('left')">추가하기</button>
                <button class="btn-add-slot" id="slot-right-btn" onclick="openBallPicker('right')">추가하기</button>
            </div>
            <button class="btn-main-action btn-start" onclick="startMatch()">시작하기 ▶</button>
        </div>

        <!-- 인게임 대결 화면 -->
        <div id="ingame-controls" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
            <div class="ingame-status-panel">
                <div class="status-row-group">
                    <div class="player-status-card">
                        <div class="player-name-label player-name-p1" id="p1-name-txt">동룡쓰 볼</div>
                        <div class="hp-bar-outer">
                            <div class="hp-bar-inner" id="p1-hp-fill"></div>
                            <div class="hp-text-overlay" id="p1-hp-txt">250 / 250</div>
                        </div>
                        <div class="sub-gauge-bar"><div class="sub-gauge-fill" style="width:70%;"></div></div>
                    </div>
                    <div class="player-status-card">
                        <div class="player-name-label player-name-p2" id="p2-name-txt">미스터비스트 볼</div>
                        <div class="hp-bar-outer">
                            <div class="hp-bar-inner" id="p2-hp-fill"></div>
                            <div class="hp-text-overlay" id="p2-hp-txt">250 / 250</div>
                        </div>
                        <div class="sub-gauge-bar"><div class="sub-gauge-fill" style="width:40%;"></div></div>
                    </div>
                </div>
            </div>
            <button class="btn-main-action btn-exit" onclick="exitMatch()">나가기 🚪</button>
        </div>

        <div class="footer-info">
            <div>created by ball_fight_tiktok</div>
            <div>⚠️ 인게임 화면을 녹화 후 영상으로 사용하는 행위는 엄격히 금지됩니다</div>
            <div style="margin-top: 6px; font-size: 10px;">내 아이디 SHD7BP &nbsp;&nbsp;&nbsp;&nbsp; v4.13.39</div>
        </div>

    </div>

    <!-- 볼 선택 모달 팝업창 -->
    <div class="modal-overlay hidden" id="ball-picker-modal">
        <div class="picker-modal-box">
            <button class="modal-close-btn" onclick="closeBallPicker()">✕</button>
            <div class="picker-grid" id="ball-picker-grid"></div>
        </div>
    </div>

    <script>
        // 요청하신 직접 만든 공들 (체력 모두 250으로 설정)
        const ballList = [
            { name: '동룡쓰 볼', hp: 250, color: '#1e90ff' },
            { name: '미스터비스트 볼', hp: 250, color: '#e74c3c' },
            { name: '상품컴퍼니 볼', hp: 250, color: '#f1c40f' }
        ];

        let selectedLeftBall = null;
        let selectedRightBall = null;
        let currentTargetSide = null;

        let isGaming = false;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let p1 = { x: 120, y: 200, radius: 30, vx: 3, vy: 2.5, hp: 250, maxHp: 250, name: '동룡쓰 볼', color: '#1e90ff' };
        let p2 = { x: 280, y: 200, radius: 30, vx: -2.5, vy: 3, hp: 250, maxHp: 250, name: '미스터비스트 볼', color: '#e74c3c' };

        function openBallPicker(side) {
            currentTargetSide = side;
            const grid = document.getElementById('ball-picker-grid');
            grid.innerHTML = '';

            ballList.forEach(ball => {
                const btn = document.createElement('div');
                btn.className = 'ball-select-btn';
                btn.innerText = ball.name;
                btn.onclick = () => chooseBall(ball);
                grid.appendChild(btn);
            });

            document.getElementById('ball-picker-modal').classList.remove('hidden');
        }

        function closeBallPicker() {
            document.getElementById('ball-picker-modal').classList.add('hidden');
        }

        function chooseBall(ball) {
            if (currentTargetSide === 'left') {
                selectedLeftBall = ball;
                const slotBtn = document.getElementById('slot-left-btn');
                slotBtn.innerText = ball.name;
                slotBtn.classList.add('selected');
            } else {
                selectedRightBall = ball;
                const slotBtn = document.getElementById('slot-right-btn');
                slotBtn.innerText = ball.name;
                slotBtn.classList.add('selected');
            }
            closeBallPicker();
        }

        function startMatch() {
            if (!selectedLeftBall || !selectedRightBall) {
                alert('양쪽 볼을 모두 선택해주세요!');
                return;
            }

            p1.name = selectedLeftBall.name;
            p1.maxHp = selectedLeftBall.hp;
            p1.hp = selectedLeftBall.hp;
            p1.color = selectedLeftBall.color;
            p1.x = 120; p1.y = 200;

            p2.name = selectedRightBall.name;
            p2.maxHp = selectedRightBall.hp;
            p2.hp = selectedRightBall.hp;
            p2.color = selectedRightBall.color;
            p2.x = 280; p2.y = 200;

            document.getElementById('p1-name-txt').innerText = p1.name;
            document.getElementById('p2-name-txt').innerText = p2.name;

            document.getElementById('lobby-controls').classList.add('hidden');
            document.getElementById('ingame-controls').classList.remove('hidden');

            isGaming = true;
            updateHpBars();
        }

        function exitMatch() {
            isGaming = false;
            document.getElementById('ingame-controls').classList.add('hidden');
            document.getElementById('lobby-controls').classList.remove('hidden');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function updateHpBars() {
            const p1Pct = Math.max(0, (p1.hp / p1.maxHp) * 100);
            const p2Pct = Math.max(0, (p2.hp / p2.maxHp) * 100);

            document.getElementById('p1-hp-fill').style.width = p1Pct + '%';
            document.getElementById('p1-hp-txt').innerText = `${Math.ceil(p1.hp)} / ${p1.maxHp}`;

            document.getElementById('p2-hp-fill').style.width = p2Pct + '%';
            document.getElementById('p2-hp-txt').innerText = `${Math.ceil(p2.hp)} / ${p2.maxHp}`;
        }

        function runGameLoop() {
            if (isGaming) {
                p1.x += p1.vx; p1.y += p1.vy;
                p2.x += p2.vx; p2.y += p2.vy;

                if (p1.x - p1.radius < 0 || p1.x + p1.radius > canvas.width) p1.vx *= -1;
                if (p1.y - p1.radius < 0 || p1.y + p1.radius > canvas.height) p1.vy *= -1;
                if (p2.x - p2.radius < 0 || p2.x + p2.radius > canvas.width) p2.vx *= -1;
                if (p2.y - p2.radius < 0 || p2.y + p2.radius > canvas.height) p2.vy *= -1;

                let dx = p2.x - p1.x;
                let dy = p2.y - p1.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < p1.radius + p2.radius) {
                    let tempVx = p1.vx; let tempVy = p1.vy;
                    p1.vx = p2.vx; p1.vy = p2.vy;
                    p2.vx = tempVx; p2.vy = tempVy;

                    p1.hp = Math.max(0, p1.hp - 6);
                    p2.hp = Math.max(0, p2.hp - 6);
                    updateHpBars();

                    if (p1.hp <= 0 || p2.hp <= 0) {
                        isGaming = false;
                        setTimeout(() => {
                            alert(p1.hp > 0 ? `🏆 ${p1.name} 승리!` : `🏆 ${p2.name} 승리!`);
                            exitMatch();
                        }, 100);
                    }
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Player 1
                ctx.save();
                ctx.beginPath();
                ctx.arc(p1.x, p1.y, p1.radius + 18, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(30, 144, 255, 0.15)";
                ctx.fill();

                ctx.beginPath();
                ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
                ctx.fillStyle = p1.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#000000";
                ctx.stroke();
                ctx.restore();

                // Player 2
                ctx.save();
                ctx.beginPath();
                ctx.arc(p2.x, p2.y, p2.radius + 18, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(231, 76, 60, 0.15)";
                ctx.fill();

                ctx.beginPath();
                ctx.arc(p2.x, p2.y, p2.radius, 0, Math.PI * 2);
                ctx.fillStyle = p2.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#000000";
                ctx.stroke();
                ctx.restore();
            }

            requestAnimationFrame(runGameLoop);
        }

        requestAnimationFrame(runGameLoop);
    </script>
</body>
</html>
