<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Ball Fight Arena</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #0d0f17;
      color: #f1f5f9;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 좌측 컨트롤 패널 */
    #sidebar {
      width: 340px;
      background: #151926;
      border-right: 1px solid #262d42;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .panel-box {
      background: #1c2233;
      border: 1px solid #2a334d;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-weight: 700;
      font-size: 0.85rem;
      transition: transform 0.1s, filter 0.15s;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      flex: 1;
      font-size: 0.95rem;
      padding: 12px;
    }

    .btn-danger {
      background: #ef4444;
      color: #fff;
    }

    .btn-secondary {
      background: #2b344d;
      color: #e2e8f0;
      flex: 1;
    }

    .btn-secondary:hover {
      background: #364161;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
    }

    select, input[type="text"] {
      background: #0f131f;
      border: 1px solid #333e5c;
      color: #f8fafc;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .add-form {
      display: flex;
      gap: 6px;
    }

    .add-form input[type="text"] {
      flex: 1;
      min-width: 0;
    }

    .add-form input[type="color"] {
      width: 36px;
      height: 34px;
      border: none;
      background: none;
      cursor: pointer;
    }

    #fighter-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }

    .fighter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #121622;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #262f47;
      font-size: 0.85rem;
    }

    .fighter-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    .remove-btn {
      background: transparent;
      color: #94a3b8;
      padding: 2px 6px;
      font-size: 0.8rem;
    }

    .remove-btn:hover {
      color: #ef4444;
    }

    /* 우측 게임 아레나 영역 */
    #main-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #171c2e 0%, #090b10 100%);
    }

    canvas {
      display: block;
    }

    /* 우상단 실시간 순위 & 킬로그 */
    #hud {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(15, 20, 34, 0.82);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
    }

    .hud-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    #leaderboard {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.8rem;
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lb-dead {
      opacity: 0.4;
      text-decoration: line-through;
    }

    #kill-feed {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.75rem;
      color: #cbd5e1;
      max-height: 120px;
      overflow: hidden;
    }

    /* 우승 배너 */
    #winner-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 11, 16, 0.75);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }

    #winner-overlay.show {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    #winner-text {
      font-size: 2.8rem;
      font-weight: 900;
      text-shadow: 0 4px 24px rgba(56, 189, 248, 0.6);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- 좌측 설정 사이드바 -->
  <div id="sidebar">
    <h1>⚔️ BALL FIGHT ARENA</h1>

    <div class="panel-box">
      <div class="btn-row">
        <button id="start-btn" class="btn-primary">▶ 배틀 시작 / 리셋</button>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="loadPreset('colors')">🎨 기본 컬러</button>
        <button class="btn-secondary" onclick="loadPreset('countries')">🌍 국가 대항전</button>
        <button class="btn-secondary" onclick="loadPreset('animals')">🦁 맹수 배틀</button>
      </div>
    </div>

    <div class="panel-box">
      <div class="panel-title">게임 규칙 & 무기 설정</div>

      <div class="control-group">
        <label><span>무기 타입</span></label>
        <select id="weapon-type">
          <option value="sword">⚔️ 회전 장검 (기본)</option>
          <option value="dual">🗡️ 쌍검 (빠른 연타)</option>
          <option value="scythe">🌙 대낫 (긴 사거리)</option>
        </select>
      </div>

      <div class="control-group">
        <label><span>기본 체력 (HP)</span> <span id="hp-val">100</span></label>
        <input type="range" id="base-hp" min="50" max="300" step="10" value="100" />
      </div>

      <div class="control-group">
        <label><span>기본 공격력</span> <span id="dmg-val">20</span></label>
        <input type="range" id="base-dmg" min="10" max="60" step="5" value="20" />
      </div>

      <div class="control-group">
        <label><span>이동 속도</span> <span id="spd-val">5</span></label>
        <input type="range" id="base-spd" min="2" max="10" step="1" value="5" />
      </div>

      <div class="control-group">
        <label>
          <span>🔥 자기장 축소 (서든데스)</span>
          <input type="checkbox" id="shrink-arena" checked />
        </label>
      </div>

      <div class="control-group">
        <label>
          <span>🔊 효과음 활성화</span>
          <input type="checkbox" id="sound-toggle" checked />
        </label>
      </div>
    </div>

    <div class="panel-box">
      <div class="panel-title">참가자 목록 (<span id="count-label">0</span>명)</div>
      <div class="add-form">
        <input type="text" id="new-name" placeholder="이름 / 이모지 (예: 🇰🇷 한국)" maxlength="12" />
        <input type="color" id="new-color" value="#38bdf8" />
        <button class="btn-secondary" style="flex:0;" onclick="addFighter()">추가</button>
      </div>
      <div id="fighter-list"></div>
    </div>
  </div>

  <!-- 메인 캔버스 영역 -->
  <div id="main-area">
    <canvas id="arena"></canvas>

    <div id="hud">
      <div class="hud-box">
        <div class="hud-title">🏆 생존 순위</div>
        <div id="leaderboard"></div>
      </div>
      <div class="hud-box">
        <div class="hud-title">💀 킬 로그</div>
        <div id="kill-feed"></div>
      </div>
    </div>

    <div id="winner-overlay">
      <div style="font-size: 1.2rem; color: #94a3b8; font-weight: 700;">VICTORY ROYALE</div>
      <div id="winner-text">👑 WINNER</div>
      <button class="btn-primary" style="flex:0; padding: 14px 32px; font-size: 1.1rem;" onclick="startBattle()">다시 싸우기</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('arena');
    const ctx = canvas.getContext('2d');
    const mainArea = document.getElementById('main-area');

    // 오디오 합성기 (외부 파일 없이 타격음 생성)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (!document.getElementById('sound-toggle').checked) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'clash') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(950, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.08);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'kill') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now + 0.1);
        osc.frequency.setValueAtTime(659, now + 0.2);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    // 프리셋 데이터
    const PRESETS = {
      colors: [
        { name: 'RED', color: '#ef4444' },
        { name: 'BLUE', color: '#3b82f6' },
        { name: 'GREEN', color: '#22c55e' },
        { name: 'YELLOW', color: '#eab308' },
        { name: 'PURPLE', color: '#a855f7' },
        { name: 'CYAN', color: '#06b6d4' }
      ],
      countries: [
        { name: '🇰🇷 한국', color: '#3b82f6' },
        { name: '🇯🇵 일본', color: '#f8fafc' },
        { name: '🇺🇸 미국', color: '#ef4444' },
        { name: '🇨🇳 중국', color: '#dc2626' },
        { name: '🇬🇧 영국', color: '#6366f1' },
        { name: '🇧🇷 브라질', color: '#22c55e' }
      ],
      animals: [
        { name: '🦁 사자', color: '#f59e0b' },
        { name: '🐯 호랑이', color: '#ea580c' },
        { name: '🐺 늑대', color: '#64748b' },
        { name: '🐻 곰', color: '#92400e' },
        { name: '🦈 상어', color: '#0284c7' },
        { name: '🐉 드래곤', color: '#10b981' }
      ]
    };

    let roster = [...PRESETS.colors];
    let balls = [];
    let particles = [];
    let floatingTexts = [];
    let arenaRadius = 280;
    let initialArenaRadius = 280;
    let hitStopFrames = 0;
    let shakeTime = 0;
    let gameRunning = false;

    // UI 슬라이더 바인딩
    const hpSlider = document.getElementById('base-hp');
    const dmgSlider = document.getElementById('base-dmg');
    const spdSlider = document.getElementById('base-spd');
    hpSlider.oninput = () => document.getElementById('hp-val').textContent = hpSlider.value;
    dmgSlider.oninput = () => document.getElementById('dmg-val').textContent = dmgSlider.value;
    spdSlider.oninput = () => document.getElementById('spd-val').textContent = spdSlider.value;

    function resizeCanvas() {
      canvas.width = mainArea.clientWidth;
      canvas.height = mainArea.clientHeight;
      initialArenaRadius = Math.min(canvas.width, canvas.height) * 0.42;
      if (!gameRunning) arenaRadius = initialArenaRadius;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderRoster() {
      const list = document.getElementById('fighter-list');
      document.getElementById('count-label').textContent = roster.length;
      list.innerHTML = '';
      roster.forEach((f, idx) => {
        const div = document.createElement('div');
        div.className = 'fighter-item';
        div.innerHTML = `
          <div class="fighter-info">
            <span class="color-dot" style="background:${f.color}"></span>
            <span>${f.name}</span>
          </div>
          <button class="remove-btn" onclick="removeFighter(${idx})">✕</button>
        `;
        list.appendChild(div);
      });
    }

    function loadPreset(key) {
      roster = PRESETS[key].map(item => ({ ...item }));
      renderRoster();
      startBattle();
    }

    function addFighter() {
      const nameInput = document.getElementById('new-name');
      const colorInput = document.getElementById('new-color');
      const name = nameInput.value.trim() || `BALL ${roster.length + 1}`;
      roster.push({ name, color: colorInput.value });
      nameInput.value = '';
      renderRoster();
    }

    function removeFighter(idx) {
      if (roster.length <= 2) {
        alert('최소 2명의 참가자가 필요합니다.');
        return;
      }
      roster.splice(idx, 1);
      renderRoster();
    }

    class Ball {
      constructor(data, x, y, hp, dmg, speed, weaponType) {
        this.name = data.name;
        this.color = data.color;
        this.x = x;
        this.y = y;
        this.radius = 26;
        this.maxHp = hp;
        this.hp = hp;
        this.dmg = dmg;
        this.weaponType = weaponType;
        this.kills = 0;
        this.alive = true;

        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.baseSpeed = speed;

        this.weaponAngle = Math.random() * Math.PI * 2;
        this.weaponDir = Math.random() < 0.5 ? 1 : -1;
        this.weaponSpeed = weaponType === 'dual' ? 0.13 : 0.09;
        this.weaponLength = weaponType === 'scythe' ? 68 : 54;
        this.hitCooldown = 0;
        this.flashTime = 0;
      }

      getBlades() {
        const blades = [{
          x1: this.x + Math.cos(this.weaponAngle) * this.radius,
          y1: this.y + Math.sin(this.weaponAngle) * this.radius,
          x2: this.x + Math.cos(this.weaponAngle) * (this.radius + this.weaponLength),
          y2: this.y + Math.sin(this.weaponAngle) * (this.radius + this.weaponLength)
        }];

        if (this.weaponType === 'dual') {
          const opp = this.weaponAngle + Math.PI;
          blades.push({
            x1: this.x + Math.cos(opp) * this.radius,
            y1: this.y + Math.sin(opp) * this.radius,
            x2: this.x + Math.cos(opp) * (this.radius + this.weaponLength * 0.85),
            y2: this.y + Math.sin(opp) * (this.radius + this.weaponLength * 0.85)
          });
        }
        return blades;
      }

      update(cx, cy, arenaR) {
        if (!this.alive) return;

        if (this.hitCooldown > 0) this.hitCooldown--;
        if (this.flashTime > 0) this.flashTime--;

        // 무기 회전
        this.weaponAngle += this.weaponSpeed * this.weaponDir;

        // 위치 이동
        this.x += this.vx;
        this.y += this.vy;

        // 일정 속도 유지 보정
        const currentSpd = Math.hypot(this.vx, this.vy);
        if (currentSpd > 0.01) {
          const targetSpd = this.baseSpeed + (this.kills * 0.4);
          this.vx = (this.vx / currentSpd) * (currentSpd * 0.96 + targetSpd * 0.04);
          this.vy = (this.vy / currentSpd) * (currentSpd * 0.96 + targetSpd * 0.04);
        }

        // 원형 경기장 벽면 충돌
        const dx = this.x - cx;
        const dy = this.y - cy;
        const dist = Math.hypot(dx, dy);

        if (dist + this.radius > arenaR) {
          const nx = dx / dist;
          const ny = dy / dist;
          this.x = cx + nx * (arenaR - this.radius);
          this.y = cy + ny * (arenaR - this.radius);

          const dot = this.vx * nx + this.vy * ny;
          this.vx -= 2 * dot * nx;
          this.vy -= 2 * dot * ny;
        }
      }

      draw(ctx) {
        if (!this.alive) return;

        // 무기 렌더링
        const blades = this.getBlades();
        blades.forEach(b => {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(b.x1, b.y1);
          ctx.lineTo(b.x2, b.y2);
          ctx.lineWidth = this.weaponType === 'scythe' ? 7 : 6;
          ctx.lineCap = 'round';
          ctx.strokeStyle = '#e2e8f0';
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 10;
          ctx.stroke();

          // 칼날 궤적 하이라이트
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius + this.weaponLength * 0.85, this.weaponAngle - 0.5 * this.weaponDir, this.weaponAngle, this.weaponDir < 0);
          ctx.strokeStyle = this.color + '55';
          ctx.lineWidth = 4;
          ctx.stroke();
          ctx.restore();
        });

        // 본체 원
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.flashTime > 0 ? '#ffffff' : this.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#0f172a';
        ctx.stroke();

        // 체력 텍스트 (공 내부)
        ctx.fillStyle = this.flashTime > 0 ? '#000' : '#fff';
        ctx.font = '800 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText(Math.ceil(this.hp), this.x, this.y);

        // 이름 라벨 (공 위쪽)
        ctx.font = '700 12px sans-serif';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(this.name, this.x, this.y - this.radius - 10);
        ctx.restore();
      }
    }

    // 선분과 원의 최단 거리 계산
    function distToSegment(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    // 두 선분 교차 검사 (무기 패링용)
    function segmentsIntersect(a, b, c, d, p, q, r, s) {
      const det = (c - a) * (s - q) - (r - p) * (d - b);
      if (det === 0) return false;
      const lambda = ((s - q) * (r - a) + (p - r) * (s - b)) / det;
      const gamma = ((b - d) * (r - a) + (c - a) * (s - b)) / det;
      return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
    }

    function spawnParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 5;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 20 + Math.random() * 15,
          maxLife: 35,
          color,
          size: 2 + Math.random() * 3
        });
      }
    }

    function spawnFloatingText(x, y, text, color = '#fff') {
      floatingTexts.push({
        x, y, text, color,
        vy: -1.5,
        life: 35
      });
    }

    function addKillLog(killer, victim) {
      const feed = document.getElementById('kill-feed');
      const item = document.createElement('div');
      item.innerHTML = `<strong style="color:${killer.color}">${killer.name}</strong> ⚔️ <span style="color:${victim.color}">${victim.name}</span>`;
      feed.prepend(item);
      if (feed.children.length > 6) feed.lastChild.remove();
    }

    function updateLeaderboard() {
      const lb = document.getElementById('leaderboard');
      const sorted = [...balls].sort((a, b) => {
        if (a.alive !== b.alive) return b.alive - a.alive;
        return b.hp - a.hp;
      });

      lb.innerHTML = sorted.map(b => `
        <div class="lb-row ${b.alive ? '' : 'lb-dead'}">
          <span><span class="color-dot" style="background:${b.color};width:9px;height:9px;"></span> ${b.name}</span>
          <span>${b.alive ? Math.ceil(b.hp) + ' HP' : 'OUT'}</span>
        </div>
      `).join('');
    }

    function startBattle() {
      if (roster.length < 2) return;
      document.getElementById('winner-overlay').classList.remove('show');
      document.getElementById('kill-feed').innerHTML = '';

      resizeCanvas();
      arenaRadius = initialArenaRadius;
      particles = [];
      floatingTexts = [];

      const hp = Number(hpSlider.value);
      const dmg = Number(dmgSlider.value);
      const spd = Number(spdSlider.value);
      const weaponType = document.getElementById('weapon-type').value;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const spawnDist = arenaRadius * 0.55;

      balls = roster.map((f, i) => {
        const angle = (i / roster.length) * Math.PI * 2;
        const x = cx + Math.cos(angle) * spawnDist;
        const y = cy + Math.sin(angle) * spawnDist;
        return new Ball(f, x, y, hp, dmg, spd, weaponType);
      });

      gameRunning = true;
      updateLeaderboard();
    }

    document.getElementById('start-btn').onclick = startBattle;

    function handleCollisions() {
      for (let i = 0; i < balls.length; i++) {
        const b1 = balls[i];
        if (!b1.alive) continue;

        for (let j = i + 1; j < balls.length; j++) {
          const b2 = balls[j];
          if (!b2.alive) continue;

          // 1. 공 본체끼리 탄성 충돌
          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = b1.radius + b2.radius;

          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = (minDist - dist) / 2;

            b1.x -= nx * overlap;
            b1.y -= ny * overlap;
            b2.x += nx * overlap;
            b2.y += ny * overlap;

            const dvx = b2.vx - b1.vx;
            const dvy = b2.vy - b1.vy;
            const velAlongNormal = dvx * nx + dvy * ny;

            if (velAlongNormal < 0) {
              const impulse = -velAlongNormal;
              b1.vx -= impulse * nx;
              b1.vy -= impulse * ny;
              b2.vx += impulse * nx;
              b2.vy += impulse * ny;
            }
          }

          // 2. 무기끼리 패링(튕김) 검사
          const blades1 = b1.getBlades();
          const blades2 = b2.getBlades();
          let clashed = false;

          for (const s1 of blades1) {
            for (const s2 of blades2) {
              if (segmentsIntersect(s1.x1, s1.y1, s1.x2, s1.y2, s2.x1, s2.y1, s2.x2, s2.y2)) {
                clashed = true;
                const mx = (s1.x2 + s2.x2) / 2;
                const my = (s1.y2 + s2.y2) / 2;
                spawnParticles(mx, my, '#fde047', 6);
                break;
              }
            }
            if (clashed) break;
          }

          if (clashed) {
            b1.weaponDir *= -1;
            b2.weaponDir *= -1;
            b1.weaponAngle += b1.weaponSpeed * b1.weaponDir * 2;
            b2.weaponAngle += b2.weaponSpeed * b2.weaponDir * 2;
            playSound('clash');
          }

          // 3. 무기 -> 상대 본체 타격 검사
          checkBladeHit(b1, b2, blades1);
          checkBladeHit(b2, b1, blades2);
        }
      }
    }

    function checkBladeHit(attacker, defender, blades) {
      if (!attacker.alive || !defender.alive || defender.hitCooldown > 0) return;

      for (const s of blades) {
        const d = distToSegment(defender.x, defender.y, s.x1, s.y1, s.x2, s.y2);
        if (d <= defender.radius + 4) {
          // 데미지 적용
          const damage = attacker.dmg + attacker.kills * 3;
          defender.hp -= damage;
          defender.hitCooldown = 14;
          defender.flashTime = 6;

          // 넉백 적용
          const angle = Math.atan2(defender.y - attacker.y, defender.x - attacker.x);
          defender.vx = Math.cos(angle) * (attacker.baseSpeed * 1.6);
          defender.vy = Math.sin(angle) * (attacker.baseSpeed * 1.6);

          // 타격감 연출
          hitStopFrames = 2;
          shakeTime = 6;
          spawnParticles(defender.x, defender.y, defender.color, 14);
          spawnFloatingText(defender.x, defender.y - 20, `-${damage}`, '#f87171');
          playSound('hit');

          // 사망 처리
          if (defender.hp <= 0) {
            defender.hp = 0;
            defender.alive = false;
            attacker.kills += 1;
            attacker.hp = Math.min(attacker.maxHp, attacker.hp + 20); // 킬 보너스 회복
            attacker.radius = Math.min(38, attacker.radius + 2);

            spawnParticles(defender.x, defender.y, defender.color, 35);
            spawnFloatingText(attacker.x, attacker.y - 30, '+20 HP!', '#4ade80');
            addKillLog(attacker, defender);
            playSound('kill');
          }

          updateLeaderboard();
          break;
        }
      }
    }

    function loop() {
      requestAnimationFrame(loop);

      if (hitStopFrames > 0) {
        hitStopFrames--;
        return;
      }

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 화면 흔들림(Screen Shake)
      if (shakeTime > 0) {
        shakeTime--;
        const mag = shakeTime * 1.2;
        ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
      }

      // 서든데스 자기장 축소
      if (gameRunning && document.getElementById('shrink-arena').checked) {
        if (arenaRadius > 110) {
          arenaRadius -= 0.08;
        }
      }

      // 원형 아레나 바닥 및 테두리
      ctx.beginPath();
      ctx.arc(cx, cy, arenaRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#111625';
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = arenaRadius < initialArenaRadius * 0.6 ? '#ef4444' : '#38bdf8';
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 18;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 경기장 중앙 가이드 링
      ctx.beginPath();
      ctx.arc(cx, cy, arenaRadius * 0.35, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 2;
      ctx.stroke();

      if (gameRunning) {
        balls.forEach(b => b.update(cx, cy, arenaRadius));
        handleCollisions();

        // 최후의 1인 체크
        const aliveBalls = balls.filter(b => b.alive);
        if (aliveBalls.length <= 1) {
          gameRunning = false;
          const winner = aliveBalls[0];
          const overlay = document.getElementById('winner-overlay');
          const winText = document.getElementById('winner-text');
          if (winner) {
            winText.textContent = `👑 ${winner.name} 승리!`;
            winText.style.color = winner.color;
          } else {
            winText.textContent = '무승부!';
          }
          overlay.classList.add('show');
          playSound('win');
        }
      }

      // 공 & 무기 그리기
      balls.forEach(b => b.draw(ctx));

      // 파티클 업데이트 및 그리기
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.94;
        p.vy *= 0.94;
        p.life--;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 데미지 플로팅 텍스트
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life--;
        if (ft.life <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = Math.min(1, ft.life / 15);
        ctx.font = '800 15px sans-serif';
        ctx.fillStyle = ft.color;
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
      }
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    // 초기화 및 실행
    renderRoster();
    startBattle();
    loop();
  </script>
</body>
</html>
